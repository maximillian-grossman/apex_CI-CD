      action: Set Value

    settings: 
      set-type: PL/SQL Expression
      pl/sql-expression: ':OP_PREFIX || :AFF_SRVC_POOL_ALIAS || :MED_SVC_ALIAS'
      items-to-submit: 
      - OP_PREFIX
      - AFF_SRVC_POOL_ALIAS
      - MED_SVC_ALIAS
      escape-special-characters: true
      suppress-change-event: false

    affected-elements: 
      selection-type: Column(s)
      column(s): 
      - PATIENT_SERVICE_CODE

    execution: 
      sequence: 10
      event: Update Patient Service Code # 20778917004191253
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

