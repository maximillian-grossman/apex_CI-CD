  when: 
    event: Change
    selection-type: Column(s)
    interactive-grid: Services_Directory # 50557614531511957
    column(s): 
    - OP_PREFIX
    - AFF_SRVC_POOL_ALIAS
    - MED_SVC_ALIAS

  actions: 
  - # ====== Action: Set Value ===================================
    id: 20779460358191254
