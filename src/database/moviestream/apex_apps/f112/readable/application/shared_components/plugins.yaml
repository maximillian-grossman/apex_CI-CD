- # ====== Plugin: Badge =======================================
  id: 49866706163320284933
  identification: 
    name: Badge
    internal-name: THEME_42$BADGE
    theme: Universal Theme # 42
    type: Template Component

  advanced: 
    quick-pick: false

  subscription: 
    master: 
      referenced-id: 1564377533892414278

    subscribe-component-settings: true

  templates: 
    available-as: 
    - Single (Partial)
    - Multiple (Report)
    partial: |
      {if APEX$IS_LAZY_LOADING/}
        <span class="t-Badge is-placeholder{if ?SIZE/} #SIZE#{endif/}{if ?SHAPE/} #SHAPE#{endif/}"></span>
      {else/}
        {if ?LINK/}<a href="#LINK#" #LINK_ATTR#{else/}<span{endif/} class="t-Badge{if ?STATE/} t-Badge--#STATE#{endif/}{if ?STYLE/} #STYLE#{endif/}{if ?SIZE/} #SIZE#{endif/}{if ?SHAPE/} #SHAPE#{endif/}" role="status" aria-label="#LABEL!STRIPHTML# #VALUE#" title="#LABEL!STRIPHTML# #VALUE#">
          {if ?ICON/}<span class="t-Badge-icon #ICON#" aria-hidden="true"></span>{endif/}
          {if LABEL_DISPLAY/}<span class="t-Badge-label">#LABEL#</span>{endif/}
          <span class="t-Badge-value">#VALUE#</span>
        {if ?LINK/}</a>{else/}</span>{endif/}
      {endif/}
      
    report-body: |
      {if !APEX$HAS_MESSAGE/}
        <ul class="t-Badges #APEX$COMPONENT_CSS_CLASSES#">#APEX$ROWS#</ul>
      {endif/}
    report-row: |
      <li class="t-Badges-item" #APEX$ROW_IDENTIFICATION#>#APEX$PARTIAL#</li>
      
    translate-templates: true
    default-escape-mode: HTML
    number-of-lazy-loading-skeletons: 1

  callbacks: 
    api-interface: Procedure with Legacy Attributes [deprecated]

  custom-attributes: 
    substitute-attribute-values: true

  information: 
    version: 1.0
    help-text: Display content within a badge. Available for multiple report rows or a single row.

  custom-attributes: 
  - # ====== Custom Attribute: Label =============================
    id: 41142412359421365
    identification: 
      static-id: LABEL
      attribute: 1
      name: Label
      scope: Component

    layout: 
      sequence: 10

    settings: 
      type: Text
      common: true
      show-in-wizard: true
      required: true
      translatable: true
      escape-mode: Raw

    help: 
      help-text: Enter a value for the badge label or select a source column from the quick pick options.

  - # ====== Custom Attribute: Value =============================
    id: 41142855378421365
    identification: 
      static-id: VALUE
      attribute: 2
      name: Value
      scope: Component

    layout: 
      sequence: 20

    settings: 
      type: Session State Value
      common: true
      show-in-wizard: true
      required: true
      translatable: false
      data-types: 
      - Varchar2
      - Number
      - Date
      - Interval Year to Month
      - Interval Day to Second
      escape-mode: Strip HTML

    help: 
      help-text: Select a source column for the badge value.

  - # ====== Custom Attribute: State =============================
    id: 41143327460421366
    identification: 
      static-id: STATE
      attribute: 3
      name: State
      scope: Component

    layout: 
      sequence: 30

    settings: 
      type: Session State Value
      common: true
      show-in-wizard: true
      required: false
      translatable: false
      data-types: 
      - Varchar2
      escape-mode: HTML Attribute

    help: 
      help-text: Select the source column for the state of the badge. Substitute column value with "danger", "warning", "success" or "info" for default styling.

  - # ====== Custom Attribute: Icon ==============================
    id: 41143914947421366
    identification: 
      static-id: ICON
      attribute: 4
      name: Icon
      scope: Component

    layout: 
      sequence: 40

    settings: 
      type: Icon
      common: true
      show-in-wizard: true
      required: false
      translatable: false
      escape-mode: HTML Attribute

    help: 
      help-text: Enter an icon class or use the Pick Icon dialog to select the icon you want to add to display in the badge.

  - # ====== Custom Attribute: Display Label =====================
    id: 41144354953421366
    identification: 
      static-id: LABEL_DISPLAY
      attribute: 5
      name: Display Label
      scope: Component

    layout: 
      sequence: 50

    settings: 
      type: Yes/No
      common: true
      show-in-wizard: true
      required: false
      translatable: false
      escape-mode: HTML Attribute

    default: 
      value: N

    help: 
      help-text: Specify whether to display or hide the badge label. When set to Yes, the badge label will be displayed in addition to the badge value. When set to No, only the badge value will be displayed.

  - # ====== Custom Attribute: Style =============================
    id: 41144843472421367
    identification: 
      static-id: STYLE
