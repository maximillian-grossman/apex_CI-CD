- # ====== Dynamic Action: New_1 ===============================
  id: 19704604908956805
  identification: 
    name: New_1

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: Print2 # 19704397515956803

  actions: 
  - # ====== Action: Execute Server-side Code ====================
    id: 19704732507956806
    identification: 
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |
        DECLARE
            l_template       blob;
            l_template_id    number;
            l_data           sys.json_object_t := sys.json_object_t();
            l_document       blob;
        BEGIN
        
            SELECT file_content
              INTO l_template
              FROM apex_application_static_files
             WHERE file_name = 'templates/customer-order.docx' and APPLICATION_ID = :APP_ID;
        
            l_template_id := apex_print.upload_template( p_template => l_template );
        
            l_data.put( 'name', 'Scott' );
        
            l_document := apex_print.generate_document(
                              p_data         => l_data.to_clob,
                              p_template_id  => l_template_id );
        
            apex_print.remove_template( p_template_id => l_template_id );
        apex_http.download(
                p_blob          => l_document,
                p_content_type  => 'application/pdf',
                p_filename      => 'hello.pdf' );
        
            apex_application.stop_apex_engine;
        EXCEPTION
            WHEN others THEN
                apex_print.remove_template( p_template_id => l_template_id );
        END;

    execution: 
      sequence: 10
      event: New_1 # 19704604908956805
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

