      id: 22532162869508801
      entry: 
        sequence: 10
        display: Rounded
        return: t-Avatar--rounded

      advanced: 
        quick-pick: false

      help: 
        help-text: Displayed within a square with rounded corners.

    - # ====== Entry: Circular =====================================
      id: 22532580979508802
      entry: 
        sequence: 20
        display: Circular
        return: t-Avatar--circle

      advanced: 
        quick-pick: false

      help: 
        help-text: Displayed within a circular shape.

    - # ====== Entry: Square =======================================
      id: 22532924227508802
      entry: 
        sequence: 30
        display: Square
        return: t-Avatar--square

      advanced: 
        quick-pick: false

      help: 
        help-text: Displayed within a square shape.

    - # ====== Entry: No Shape =====================================
      id: 22533379408508802
      entry: 
        sequence: 40
        display: No Shape
        return: t-Avatar--noShape

      advanced: 
        quick-pick: false

      help: 
        help-text: Displayed inline without a containing shape.

  - # ====== Custom Attribute: Size ==============================
