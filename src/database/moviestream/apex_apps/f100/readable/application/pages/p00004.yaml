- # ====== Dynamic Action: New =================================
  id: 22655640096514338
  identification: 
    name: New

  execution: 
    sequence: 30
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P4_ID

  actions: 
  - # ====== Action: Set Value ===================================
    id: 22655775956514339
    identification: 
      action: Set Value

    settings: 
      set-type: SQL Statement
      sql-statement: 'select name from genai_project where id = :P4_ID'
      items-to-submit: 
      - P4_ID
      escape-special-characters: true
      suppress-change-event: false

    affected-elements: 
      selection-type: Item(s)
      item(s): 
      - P4_PROJECT_NAME

    execution: 
      sequence: 10
      event: New # 22655640096514338
      fire-when-event-result-is: True
      fire-on-initialization: true
      stop-execution-on-error: true
      wait-for-result: true

- # ====== Dynamic Action: generatePrompt ======================
  id: 22656304859514345
  identification: 
    name: generatePrompt

  execution: 
    sequence: 40
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: P4_GENERATE_PROMPT # 22656042927514342

  actions: 
  - # ====== Action: Set Value ===================================
    id: 22656477988514346
    identification: 
      action: Set Value

    settings: 
      set-type: PL/SQL Expression
      pl/sql-expression: |
        replace(
        replace(genai.get_prompt(
        	    query_parameter => :P4_PARAMETER,
        	    project_id => nvl(:P4_ID, 1)
            ),
        '\r\n', chr(10)),
        '\n\n', chr(10)
        )
        
      items-to-submit: 
      - P4_ID
      - P4_PARAMETER
      escape-special-characters: false
      suppress-change-event: false

    affected-elements: 
      selection-type: Item(s)
      item(s): 
      - P4_PROMPT

    execution: 
      sequence: 10
      event: generatePrompt # 22656304859514345
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: false
      wait-for-result: true

  - # ====== Action: Set Value ===================================
    id: 22761227099673726
    identification: 
      action: Set Value

    settings: 
      set-type: Static Assignment
      suppress-change-event: false

    affected-elements: 
      selection-type: Item(s)
      item(s): 
      - P4_RESPONSE

    execution: 
      sequence: 20
      event: generatePrompt # 22656304859514345
      fire-when-event-result-is: True
      fire-on-initialization: true
      stop-execution-on-error: true
      wait-for-result: true

