  slots: 
  - # ====== Slot: Content Body ==================================
    id: 17224010364291556
    identification: 
      name: Content Body
      template-substitution: BODY

    component-type-support: 
      regions: true
      items: true
      buttons: true

    grid-layout-rendering: 
      grid: true
      maximum-fixed-columns: 12
