- # ====== Process: New ========================================
  id: 10767203940412222
  identification: 
    name: New
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      declare
      l_request_url varchar(32767);
      l_content_type varchar(32767);
      l_content_length varchar(32767);
      l_filename varchar(32767);
      l_response blob;
      download_failed_exception exception;
      BEGIN
      l_request_url := 'https://natdcshjumpstartprod.objectstorage.us-ashburn-1.oci.customer-oci.com/n/natdcshjumpstartprod/b/bucket-20240514-1532/o/' || apex_util.url_encode(:P3_filepath);
      
      l_response := apex_web_service.make_rest_request_b(
      p_url => l_request_url, 
      p_http_method => 'GET',
      p_credential_static_id => 'API_KEY'
      );
      
      if apex_web_service.g_status_code != 200 THEN
      raise download_failed_exception;
      END IF;
      
      FOR i in 1..apex_web_service.g_headers.count LOOP
      if apex_web_service.g_headers(i).name = 'Content-Length' THEN
      l_content_length := apex_web_service.g_headers(i).value;
      END IF;
      if apex_web_service.g_headers(i).name = 'Content-Type' THEN
      l_content_type := apex_web_service.g_headers(i).value;
      END IF;
      END LOOP;
      
      sys.htp.init;
      if l_content_type is not null then 
      sys.owa_util.mime_header(trim(l_content_type), false);
      end if;
      
      l_filename := substr(:p3_file_path, instr(:p3_file_path, '/')+1);
      
      sys.htp.p('Content-length: ' || l_content_length);
      sys.htp.p('Content-Disposition: attachment; filename="' || l_filename || '"' );
      sys.htp.p('Chache-Control: max age=3600');
      sys.owa_util.http_header_close;
      sys.wpg_docload.download_file(l_response);
      apex_application.stop_apex_engine;
      END;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

