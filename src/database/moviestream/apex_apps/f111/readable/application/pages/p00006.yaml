computations: 
- # ====== Computation: P6_PRIVS_MISSING_YN ====================
  id: 23678460709082486
  identification: 
    item-name: P6_PRIVS_MISSING_YN

  execution: 
    sequence: 10
    point: Before Header

  computation: 
    type: Function Body
    language: PL/SQL
    pl/sql-function-body: |
      declare
          l_priv_count pls_integer;
      begin
          select sum(priv)
            into l_priv_count
            from (select 1 as priv
                    from all_credentials
                   where credential_name  = 'OCI$RESOURCE_PRINCIPAL'
                   union all
                  select 1
                    from user_role_privs
                   where granted_role  = 'DWROLE');
          
          return 
              case 
                  when nvl( l_priv_count, 0 ) < 2 
                  then 'Y'
                  else 'N'
              end;
      end;

