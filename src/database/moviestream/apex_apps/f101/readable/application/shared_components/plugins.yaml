- # ====== Plugin: Avatar ======================================
  id: 49857450208020140104
  identification: 
    name: Avatar
    internal-name: THEME_42$AVATAR
    theme: Universal Theme # 42
    type: Template Component

  advanced: 
    quick-pick: false

  subscription: 
    master: 
      referenced-id: 1564363394689414260

    subscribe-component-settings: true

  templates: 
    available-as: 
    - Single (Partial)
    partial: |
      {if APEX$IS_LAZY_LOADING/}
        <span class="t-Avatar is-placeholder{if ?SHAPE/} #SHAPE#{endif/}{if ?SIZE/} #SIZE#{endif/}{if ?CSS_CLASSES/} #CSS_CLASSES#{endif/}"></span>
      {else/}
        {if ?LINK/}<a href="#LINK#" #LINK_ATTR#{else/}<span{endif/} class="t-Avatar{if ?TYPE/} t-Avatar--{if ?IMAGE/}image{else/}{if ?INITIALS/}initials{else/}icon{endif/}{endif/}{endif/}{if ?SHAPE/} #SHAPE#{endif/}{if ?SIZE/} #SIZE#{endif/}{if ?ICON/} #ICON#{else/} fa fa-user{endif/}{if ?CSS_CLASSES/} #CSS_CLASSES#{endif/} u-color" {if !IMAGE/}{if DESCRIPTION/} role="img" aria-label="#DESCRIPTION#" title="#DESCRIPTION#"{else/} role="presentation"{endif/}{endif/}>{if IMAGE/}<img src="#IMAGE#" alt="#DESCRIPTION#"{if ?DESCRIPTION/} title="#DESCRIPTION#"{endif/} loading="lazy" />{else/}{if ?INITIALS/}#INITIALS#{endif/}{endif/}{if ?LINK/}</a>{else/}</span>{endif/}
      {endif/}
    translate-templates: false
    default-escape-mode: HTML

  callbacks: 
    api-interface: Procedure with Legacy Attributes [deprecated]

  custom-attributes: 
    substitute-attribute-values: true

  information: 
    version: 1.0
    help-text: Display an image, icon, or initials. Available as a partial template to display a single row.

  custom-attributes: 
  - # ====== Custom Attribute: Type ==============================
    id: 31880883240276504
    identification: 
      static-id: TYPE
      attribute: 1
      name: Type
      scope: Component

    layout: 
      sequence: 10

    settings: 
      type: Select List
      lov-type: Static
      common: true
      show-in-wizard: true
      required: false
      translatable: false
      escape-mode: HTML

    default: 
      value: IMAGE

    help: 
      help-text: Select the type of content that will be displayed in the avatar.

    examples: 
      demo-value: IMAGE

    entries: 
    - # ====== Entry: Image ========================================
      id: 31881397275276507
      entry: 
        sequence: 10
        display: Image
        return: IMAGE

      advanced: 
        quick-pick: false

    - # ====== Entry: Initials =====================================
      id: 31882002396276511
      entry: 
        sequence: 20
        display: Initials
        return: INITIALS

      advanced: 
        quick-pick: false

    - # ====== Entry: Icon =========================================
      id: 31882606355276512
      entry: 
        sequence: 30
        display: Icon
        return: ICON

      advanced: 
        quick-pick: false

  - # ====== Custom Attribute: Image =============================
    id: 31883221979276514
    identification: 
      static-id: IMAGE
      attribute: 2
      name: Image
      scope: Component

    layout: 
      sequence: 20

    settings: 
      type: Media
      common: true
      show-in-wizard: true
      required: false
      translatable: false
      escape-mode: HTML Attribute

    condition: 
      depending-on-custom-attribute: Type # 31880883240276504
      depending-on-condition-type: equal to
      expression: IMAGE
      always-evaluate: true

    help: 
      help-text: |
        <p>Use the Media popup dialog to select a source for the avatar image.</p>
        
        <p>Available options include:
        <ul>
        <li>URL</li>
        <li>BLOB Column</li>
        <li>URL Column</li>
        </ul>
        </p>

    examples: 
      demo-value: '#APEX_FILES#apex_ui/img/favicons/app-artwork-catalog.png'

  - # ====== Custom Attribute: Description =======================
    id: 31883634230276515
    identification: 
      static-id: DESCRIPTION
      attribute: 3
      name: Description
      scope: Component

    layout: 
      sequence: 55

    settings: 
      type: Text
      common: true
      show-in-wizard: true
      required: false
      translatable: false
      escape-mode: HTML Attribute

    help: 
      help-text: Enter a short description of the image/icon or select a source column from the quick pick options. This will be used as title & alt text for the avatar image/icon.

  - # ====== Custom Attribute: Initials ==========================
    id: 31884141346276517
    identification: 
      static-id: INITIALS
      attribute: 4
      name: Initials
      scope: Component

    layout: 
      sequence: 40

    settings: 
      type: Session State Value
      common: true
      show-in-wizard: true
      required: false
      translatable: false
      data-types: 
      - Varchar2
      escape-mode: HTML

    condition: 
      depending-on-custom-attribute: Type # 31880883240276504
      depending-on-condition-type: equal to
      expression: INITIALS
      always-evaluate: true

    help: 
      help-text: Select the source column to be displayed within each avatar. Only varchar2 data types are supported.

  - # ====== Custom Attribute: Icon ==============================
    id: 31884703999276517
    identification: 
      static-id: ICON
      attribute: 5
      name: Icon
      scope: Component

    layout: 
      sequence: 50

    settings: 
      type: Icon
      common: true
      show-in-wizard: true
      required: false
      translatable: false
      escape-mode: HTML Attribute

    condition: 
      depending-on-custom-attribute: Type # 31880883240276504
      depending-on-condition-type: equal to
      expression: ICON
      always-evaluate: true

    help: 
      help-text: Enter an icon class or use the Pick Icon dialog to select the icon you want to add to display in the avatar.

  - # ====== Custom Attribute: Shape =============================
    id: 31885182362276517
    identification: 
      static-id: SHAPE
      attribute: 6
      name: Shape
      scope: Component

    layout: 
      sequence: 60

    settings: 
      type: Select List
      lov-type: Static
      common: true
      show-in-wizard: true
      required: false
      translatable: false
      lov-null-text: Default
      escape-mode: HTML Attribute

    help: 
      help-text: Select the shape of the avatar. Default inherits the shape set by the containing template.

    entries: 
    - # ====== Entry: Rounded ======================================
      id: 31885641609276518
      entry: 
        sequence: 10
        display: Rounded
        return: t-Avatar--rounded

      advanced: 
        quick-pick: false

      help: 
        help-text: Displayed within a square with rounded corners.

    - # ====== Entry: Circular =====================================
      id: 31886235151276519
      entry: 
        sequence: 20
        display: Circular
        return: t-Avatar--circle

      advanced: 
        quick-pick: false

      help: 
        help-text: Displayed within a circular shape.

    - # ====== Entry: Square =======================================
      id: 31886878629276520
      entry: 
        sequence: 30
        display: Square
        return: t-Avatar--square

      advanced: 
        quick-pick: false

      help: 
        help-text: Displayed within a square shape.

    - # ====== Entry: No Shape =====================================
      id: 31887452148276520
      entry: 
        sequence: 40
        display: No Shape
        return: t-Avatar--noShape

      advanced: 
        quick-pick: false

      help: 
        help-text: Displayed inline without a containing shape.

  - # ====== Custom Attribute: Size ==============================
    id: 31888115795276521
    identification: 
      static-id: SIZE
      attribute: 7
      name: Size
      scope: Component

    layout: 
      sequence: 70

    settings: 
      type: Select List
      lov-type: Static
      common: true
      show-in-wizard: true
      required: false
      translatable: false
      lov-null-text: Default
      escape-mode: HTML Attribute

    help: 
      help-text: Set the size of the avatar. The default inherits the sizing set by the containing template.

    entries: 
    - # ====== Entry: Extra Extra Small ============================
      id: 31888621615276521
      entry: 
        sequence: 10
        display: Extra Extra Small
        return: t-Avatar--xxs

      advanced: 
        quick-pick: false

    - # ====== Entry: Extra Small ==================================
      id: 31889210587276521
      entry: 
        sequence: 20
        display: Extra Small
        return: t-Avatar--xs

      advanced: 
        quick-pick: false

    - # ====== Entry: Small ========================================
      id: 31889822942276522
      entry: 
        sequence: 30
        display: Small
        return: t-Avatar--sm

      advanced: 
        quick-pick: false

    - # ====== Entry: Medium =======================================
      id: 31890410618276522
      entry: 
        sequence: 40
        display: Medium
        return: t-Avatar--md

      advanced: 
        quick-pick: false

    - # ====== Entry: Large ========================================
      id: 31890985774276522
      entry: 
        sequence: 50
        display: Large
        return: t-Avatar--lg

      advanced: 
        quick-pick: false

    - # ====== Entry: Extra Large ==================================
      id: 31891585573276524
      entry: 
        sequence: 60
        display: Extra Large
        return: t-Avatar--xl

      advanced: 
        quick-pick: false

    - # ====== Entry: Extra Extra Large ============================
      id: 31892191212276525
      entry: 
        sequence: 70
        display: Extra Extra Large
        return: t-Avatar--xxl

      advanced: 
        quick-pick: false

  - # ====== Custom Attribute: CSS Classes =======================
    id: 31892778919276525
    identification: 
      static-id: CSS_CLASSES
      attribute: 8
      name: CSS Classes
      scope: Component

    layout: 
      sequence: 80

    settings: 
      type: Text
      common: false
      show-in-wizard: true
      required: false
      translatable: false
      escape-mode: HTML Attribute

    help: 
      help-text: Enter classes to add to this component. You may add multiple classes by separating them with a space.

  action-positions: 
  - # ====== Action Position: Link ===============================
    id: 51657500995819253856
    identification: 
      name: Link
      static-id: LINK
      sequence: 10

    advanced: 
      quick-pick: true

    settings: 
