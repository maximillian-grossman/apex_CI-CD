        BEGIN
            TEXT := ''HELLO World'';
            DBMS_OUTPUT.PUT_LINE(TEXT);
        END;' AS VALUE_DIFF,
           /* language that should be used e.g. sql, javascript, json... 
              all avail. languages you find in attributes */
           'sql' AS LANGUAGE
        FROM
           DUAL
        </pre>

