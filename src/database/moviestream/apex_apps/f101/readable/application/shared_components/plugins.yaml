  - # ====== Custom Attribute: Execute on Save ===================
    id: 104138394244426134
    identification: 
      static-id: attribute_02
      attribute: 2
      name: Execute on Save
      scope: Component

    layout: 
      sequence: 9999

    settings: 
      type: PL/SQL Code
      common: true
      show-in-wizard: true
      required: true
      translatable: false

    default: 
      value: |
        DECLARE
            VR_CLOB       CLOB := :CLOB; 
            /* You need to use V('P1_COL_NAME') because :P1_COL_NAME is not supported here */
            VR_COL_NAME   VARCHAR2(200) := NVL(
                V('P1_COL_NAME'),
                'EDITOR_CODE_COLLECTION'
            );
        BEGIN
            BEGIN
                APEX_COLLECTION.CREATE_OR_TRUNCATE_COLLECTION(P_COLLECTION_NAME => VR_COL_NAME);
            EXCEPTION
                WHEN OTHERS THEN
                    NULL;
            END;
        
            APEX_COLLECTION.ADD_MEMBER(
                P_COLLECTION_NAME   => VR_COL_NAME,
                P_CLOB001           => VR_CLOB
            );
        EXCEPTION
            WHEN OTHERS THEN
                APEX_DEBUG.ERROR(SQLERRM);
                APEX_DEBUG.ERROR(DBMS_UTILITY.FORMAT_ERROR_STACK);
        END;

    help: 
      help-text: |
        <pre>
        DECLARE
            VR_CLOB       CLOB := :CLOB; 
            /* You need to use V('P1_COL_NAME') because :P1_COL_NAME is not supported here */
            VR_COL_NAME   VARCHAR2(200) := NVL(
                V('P1_COL_NAME'),
                'EDITOR_CODE_COLLECTION'
            );
        BEGIN
            BEGIN
                APEX_COLLECTION.CREATE_OR_TRUNCATE_COLLECTION(P_COLLECTION_NAME => VR_COL_NAME);
            EXCEPTION
                WHEN OTHERS THEN
                    NULL;
            END;
        
            APEX_COLLECTION.ADD_MEMBER(
                P_COLLECTION_NAME   => VR_COL_NAME,
                P_CLOB001           => VR_CLOB
            );
        EXCEPTION
            WHEN OTHERS THEN
                APEX_DEBUG.ERROR(SQLERRM);
                APEX_DEBUG.ERROR(DBMS_UTILITY.FORMAT_ERROR_STACK);
        END;
        </pre>

