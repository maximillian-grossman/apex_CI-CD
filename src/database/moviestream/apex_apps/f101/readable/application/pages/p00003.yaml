- # ====== Region: Explanation =================================
  id: 107085233411946634
  identification: 
    name: Explanation
    type: Dynamic Content

  source: 
    language: PL/SQL
    pl/sql-function-body-returning-a-clob: |
      declare
          l_explanation clob;
          l_uses_vector_index number;
          l_return clob;
          l_prompt clob;
          l_showsql OCW23_PROMPTS.showsql%type;
          l_profile_name user_cloud_ai_profiles.profile_name%type := lower(APEX_UTIL.GET_PREFERENCE(       
               p_preference => 'CLOUD_AI_PROFILE',
                  p_user       => :APP_USER));
      begin
      
      
          SELECT SHOWSQL into l_showsql FROM OCW23_PROMPTS WHERE ID = :P3_CURRENT_ID;
          SELECT PROMPT  into l_prompt FROM OCW23_PROMPTS WHERE ID = :P3_CURRENT_ID;
      
          -- You can't get an explanation if the current model was changed to Vector Search
          SELECT count(*) 
          INTO l_uses_vector_index
          FROM user_cloud_ai_profile_attributes
          WHERE upper(profile_name) =  upper(l_profile_name)
            AND upper(attribute_name) = 'VECTOR_INDEX_NAME';
      
      
          if l_uses_vector_index > 0 then
              l_return := '<h3>Explanation: </h3><div><pre>
              Unable to generate an explanation.</pre></div>';
      
          else
              l_return := '<h3>Explanation: </h3><div><pre>'||
                  dbms_cloud_ai.generate(
                      prompt => l_prompt,
                      action => 'explainsql',
                      profile_name => l_profile_name)
              ||'</pre></div>';
          
          end if;
          
          return l_return;
          
      
      end;
    page-items-to-submit: 
    - P3_CURRENT_ID

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic
