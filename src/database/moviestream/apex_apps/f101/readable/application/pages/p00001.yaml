- # ====== Dynamic Action: Open AI Settings ====================
  id: 101490062518712334
  identification: 
    name: Open AI Settings

  execution: 
    sequence: 60
    event-scope: Static

  when: 
    event: Page Load

  server-side-condition: 
    type: Function Body
    language: PL/SQL
    pl/sql-function-body: |
      return APEX_UTIL.GET_PREFERENCE(       
               p_preference => 'CLOUD_AI_PROFILE',
                  p_user       => :APP_USER) is null;

  actions: 
  - # ====== Action: Submit Page =================================
    id: 101490150254712335
    identification: 
      action: Submit Page

    settings: 
      request-/-button-name: OPEN_AI_SETTINGS
      show-processing: false

    execution: 
      sequence: 10
      event: Open AI Settings # 101490062518712334
      fire-when-event-result-is: True
      fire-on-initialization: false

processes: 
- # ====== Process: Create a Conversation ======================
  id: 104242125933589236
  identification: 
    name: Create a Conversation
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: 'INSERT INTO OCW23_CONVERSATIONS (USERNAME, STARTED_ON) VALUES (:APP_USER, SYSTIMESTAMP) returning id into :P1_CONV_ID;'

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    type: Item is NULL
    item: P1_CONV_ID

- # ====== Process: AI Call ====================================
  id: 108943011225152736
  identification: 
    name: AI Call
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      declare
          l_response clob;
          l_sql clob;
          l_has_summary number;
          l_prompt varchar2(4000);
          l_uses_vector_index number;
          l_cursor NUMBER := dbms_sql.open_cursor;
          l_profile_name user_cloud_ai_profiles.profile_name%type := lower(APEX_UTIL.GET_PREFERENCE(       
               p_preference => 'CLOUD_AI_PROFILE',
                  p_user       => :APP_USER));
      begin
      
      -- ENABLE DEBUG
      --apex_debug.enable(apex_debug.c_log_level_info);
      --APEX_DEBUG.MESSAGE(p_message => 'Marty enabled debug');
      
      
                  l_sql := dbms_cloud_ai.generate(
                      prompt => :P1_PROMPT,
                      action => 'showsql',
                      profile_name => l_profile_name
                      );
                  
                  -- check if SQL could be generated.
                  -- if not, then return the response 
                  BEGIN
                      DBMS_SQL.PARSE (l_cursor, l_sql, DBMS_SQL.native);
                  EXCEPTION
                      WHEN OTHERS THEN
                          l_response := l_sql;
                  END;
                 
            /*  -- general chat
              l_response := dbms_cloud_ai.generate(
                  prompt => :P1_PROMPT,
                  action => 'chat',
                  profile_name => l_profile_name
                  );
             */
      
          -- Generate a summary?
          select count(*)
          into l_has_summary
          from OCW23_CONVERSATIONS
          where id = :p1_conv_id 
            and summary is not null;
          
      
          if l_has_summary = 0 then
              -- Yes! Generate the summary b/c one does not exist.
              l_prompt := dbms_cloud_ai.generate(
                              prompt => 'Rewrite as a short title : '||:P1_PROMPT,
                              action => 'chat',
                              profile_name => l_profile_name
                          );
      
              
              update OCW23_CONVERSATIONS set summary = l_prompt
              where id = :p1_conv_id and summary is null;
          
          end if;
      
          insert into OCW23_PROMPTS (conv_id, prompt, response, asked_on, showsql) 
          values (:p1_conv_id, :p1_prompt, l_response, systimestamp, l_sql);
      
      end;

  execution: 
    sequence: 20
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

