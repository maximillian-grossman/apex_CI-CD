css: 
  inline: |
    /* Container Flex */
    .t-Body-mainContent,
    .t-Body-contentInner,
    .t-Body-contentInner > .container,
    .t-Body-contentInner > .container > .row,
    .t-Body-contentInner > .container > .row > .col,
    #PROMPTS,
    #PROMPTS_TemplateComponent {
      display: flex;
      flex-grow: 1;
      flex-direction: column;
    }
    
    .t-Body-mainContent {
      overflow: clip;
    }
    
    .t-Body-contentInner {
      padding: 0;
    }
    
    #PROMPTS_TemplateComponent {
      flex-shrink: 1;
    }
    
    
    /* Hide Footer */
    .t-Footer {
      --ut-footer-padding-y: .5rem;
    }
    
    .t-Footer-top,
    .t-Footer-body {
      display: none;
    }
    
    /* Prompt */
    .a-TMV-altMessage {
      justify-content: center;
      display: flex;
      flex-direction: column;
    }
    
    .a-TMV-altMessage-icon {
      display: none;
    }
    
    
    /* Question */
    .sticky-Footer {
      --ut-field-padding-y: 0rem;
      --ut-field-padding-x: 0rem;
    
      position: sticky;
      inset-inline: 0;
      inset-block-end: 0;
      background-color: #eeeae7;
      border-block-start: 1px solid #e6e6e6;
      flex-shrink: 0;
      flex-grow: 0;
    }
    
    .sticky-Footer .t-Button--icon {
      --a-button-padding-y: .625rem;
      --a-button-icon-size: 1.5rem;
    }
    
    .sticky-Footer .t-Button--icon .t-Icon {
      min-inline-size: var(--a-button-line-height, 1rem);
    }
    
    .llm-recording {
      pointer-events: auto !important;
      cursor: pointer;
    }
    
    .llm-recording:after {
      content: '';
      display: block;
      position: absolute;
      block-size: 2rem;
      inline-size: 2rem;
      border-radius: .25rem;
    }
    
    .llm-recording:hover:after {
      background-color: rgba(0, 0, 0, .1);
    }

