dynamic-actions: 
- # ====== Dynamic Action: Set AI_SERVICE ======================
  id: 106071064306719341
  identification: 
    name: Set AI_SERVICE

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P20020_SERVICE

  actions: 
  - # ====== Action: Execute Server-side Code ====================
    id: 106071131129719342
    identification: 
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |2
          APEX_UTIL.SET_PREFERENCE(        
                p_preference => 'CLOUD_AI_PROFILE',
                p_value      => :P20020_SERVICE,      
                p_user       => :APP_USER); 
      items-to-submit: 
      - P20020_SERVICE

    execution: 
      sequence: 10
      event: Set AI_SERVICE # 106071064306719341
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

- # ====== Dynamic Action: Change P20020_ENABLE_PUSH ===========
  id: 106845618410304589
  identification: 
    name: Change P20020_ENABLE_PUSH

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P20020_ENABLE_PUSH

  client-side-condition: 
    type: Item = Value
    item: P20020_ENABLE_PUSH
    value: Y

  actions: 
  - # ====== Action: Subscribe to push notifications =============
    id: 106846061423304591
    identification: 
      name: Subscribe to push notifications
      action: Execute JavaScript Code

    settings: 
      code: apex.pwa.subscribePushNotifications();

    execution: 
      sequence: 10
      event: Change P20020_ENABLE_PUSH # 106845618410304589
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Unsubscribe from push notifications =========
    id: 106846586022304593
    identification: 
      name: Unsubscribe from push notifications
      action: Execute JavaScript Code

    settings: 
      code: apex.pwa.unsubscribePushNotifications();

    execution: 
      sequence: 10
      event: Change P20020_ENABLE_PUSH # 106845618410304589
      fire-when-event-result-is: False
      fire-on-initialization: false

