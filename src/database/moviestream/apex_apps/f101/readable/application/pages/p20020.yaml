  attributes: 
    settings: 
      output-as: HTML
      expand-shortcuts: false

page-items: 
- # ====== Page Item: P20020_SERVICE ===========================
  id: 106847037125307683
  identification: 
    name: P20020_SERVICE
    type: Select List

  label: 
    label: Service
    alignment: Left

  settings: 
    page-action-on-selection: None

  multiple-values: 
    type: No

  layout: 
    sequence: 20
    region: Push Notifications # 117406801190638015
    slot: BODY
    alignment: Left
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic
    label-column-span: Page Template Default

  appearance: 
    template: Optional - Floating
    template-options: 
    - '#DEFAULT#'
    height: 1

  validation: 
    value-required: false

  list-of-values: 
    type: SQL Query
    sql-query: select profile_name d, profile_name r from user_cloud_ai_profiles;
    display-extra-values: false
    display-null-value: true
    null-display-value: '-- Select a Profile --'

  advanced: 
    warn-on-unsaved-changes: Page Default

  source: 
    type: Function Body
    language: PL/SQL
    pl/sql-function-body: |
      RETURN APEX_UTIL.GET_PREFERENCE(      
              p_preference => 'CLOUD_AI_PROFILE',
              p_user       => :APP_USER);
    used: Only when current value in session state is null

  session-state: 
    storage: Per Session (Persistent)

  quick-picks: 
    show-quick-picks: false

  security: 
    session-state-protection: Unrestricted
    store-value-encrypted-in-session-state: true
    restricted-characters: All characters can be saved.

buttons: 
