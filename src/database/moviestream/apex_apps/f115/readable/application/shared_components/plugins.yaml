    help: 
      help-text: Enter some text and/or column substitution strings to be used as the comment attributes.

  - # ====== Custom Attribute: Type ==============================
    id: 47475520531329802
    identification: 
      static-id: AVATAR_TYPE
      attribute: 5
      name: Type
