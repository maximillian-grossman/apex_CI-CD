- # ====== Region: Master Records ==============================
  id: 94889055627694534
  identification: 
    name: Master Records
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select "ID",
          null link_class,
          apex_page.get_url(p_items => 'P2_ID', p_values => "ID") link,
          null icon_class,
          null link_attr,
          null icon_color_class,
          case when nvl(:P2_ID,'0') = "ID"
            then 'is-active' 
            else ' '
          end list_class,
          substr("NAME", 1, 50)||( case when length("NAME") > 50 then '...' end ) list_title,
          substr("STATUS_CD", 1, 50)||( case when length("STATUS_CD") > 50 then '...' end ) list_text,
          null list_badge
      from "EBA_DEMO_MD_PROJECTS" x
      where (:P2_SEARCH is null
              or upper(x."NAME") like '%'||upper(:P2_SEARCH)||'%'
              or upper(x."STATUS_CD") like '%'||upper(:P2_SEARCH)||'%'
          )
      order by "NAME"
    page-items-to-submit: 
    - P2_SEARCH

  order-by: 
    type: None

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: REGION_POSITION_02
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

