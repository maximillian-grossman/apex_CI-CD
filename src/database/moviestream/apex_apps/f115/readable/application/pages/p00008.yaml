    sql-query: |
      select 
      "ID",
      "ASSIGNEE",
      "NAME",
      "DESCRIPTION",
      "PROJECT_ID",
      "MILESTONE_ID",
      is_complete_yn completed,
      "START_DATE",
      "END_DATE",
      "CREATED",
      "CREATED_BY",
      "UPDATED",
      "UPDATED_BY",
      (select count(*)
