- # ====== Region: Activity Calendar ===========================
  id: 5204081795271890250
  identification: 
    name: Activity Calendar
    type: Calendar

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select lower(USERID)||' - '
          ||trim(to_char(count(*),'999G999G999G990')) page_events,
          trunc(time_stamp) the_day
      from apex_activity_log l
      where flow_id = :APP_ID
          and userid is not null
          and userid != 'nobody'
      group by trunc(time_stamp), lower(userid)

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Blank with Attributes
    template-options: 
    - '#DEFAULT#'
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  security: 
    escape-special-characters: true

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    settings: 
      display-column: PAGE_EVENTS
      start-date-column: THE_DAY
      event-sorting: Automatic
      multiple-line-events: true
      show-tooltip: false
      maximum-events-/-day: 10
      show-weekend: true

    performance: 
      lazy-loading: true

