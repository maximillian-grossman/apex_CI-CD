- # ====== Region: Page Views ==================================
  id: 5506950138335182729
  identification: 
    name: Page Views
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select
      lower(USERID)      "User",
      step_id     "Page",
      step_id||'. '||(select page_name from apex_application_pages p where p.page_id = l.step_id and p.application_id = :app_id) page_name,
      COMPONENT_NAME,
      TIME_STAMP  "View",
      ELAP        "Elapsed",
      NUM_ROWS    "Rows",
      IR_SEARCH   "Search",
      SQLERRM     "Error",
      PAGE_MODE   "Mode",
      CONTENT_LENGTH "PgSize"
      from apex_activity_log l
      where flow_id = :app_id and 
            time_stamp > sysdate - to_number(nvl(:P29_TIMEFRAME,'00001.0000000000'),'9999999990.99999999999','NLS_NUMERIC_CHARACTERS=''.,''')
      

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
