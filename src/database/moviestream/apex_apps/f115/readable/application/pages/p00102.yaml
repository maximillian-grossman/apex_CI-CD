- # ====== Process: Submit Feedback ============================
  id: 4568645501195339756
  identification: 
    name: Submit Feedback
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      apex_util.submit_feedback (
          p_comment         => :P102_FEEDBACK,
          p_type            => :P102_FEEDBACK_TYPE,
          p_application_id  => :P102_APPLICATION_ID,
          p_page_id         => :P102_PAGE_ID,
          p_email           => null);

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  success-message: 
    success-message: Thanks for your feedback!

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: SUBMIT # 4568643305245339752

