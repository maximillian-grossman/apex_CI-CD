dynamic-actions: 
- # ====== Dynamic Action: Refresh Load Status on Timer ========
  id: 3352991626507115671
  identification: 
    name: Refresh Load Status on Timer

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Custom
    custom-event: job_timer
    selection-type: jQuery Selector
    jquery-selector: '#timer-container'

  actions: 
  - # ====== Action: Get Loading Job Status ======================
    id: 3353829347356781650
    identification: 
      name: Get Loading Job Status
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |
        begin
            select status_code
              into :P18_LOADING_STATUS
              from apex_appl_page_bg_proc_status
             where execution_id = :P18_LOAD_EXEC_ID;
        exception when others then
            :P18_LOADING_STATUS := 'SUCCESS';
        end;
      items-to-return: 
      - P18_LOADING_STATUS
      suppress-change-event: false

    execution: 
      sequence: 30
      event: Refresh Load Status on Timer # 3352991626507115671
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

- # ====== Dynamic Action: Refresh Load Status Timer ===========
  id: 3352991905465115674
  identification: 
    name: Refresh Load Status Timer

  execution: 
    sequence: 30
    event-scope: Static

  when: 
    event: Page Load

  actions: 
  - # ====== Action: Initialize Timer for Load Status Refresh ====
    id: 3352992012612115675
    identification: 
      name: Initialize Timer for Load Status Refresh
      action: Execute JavaScript Code

    settings: 
      code: |
        var lSpinner$ = apex.util.showSpinner( $( "#loadStatus" ) );
        
        var triggerRefresh = function(){ 
            var lstatus = apex.item("P18_LOADING_STATUS").getValue() ?? "ENQUEUED";
        
            apex.event.trigger( apex.jQuery("#timer-container"), "job_timer" );
        
            console.log( "current satus " + lstatus );
        
            if (  lstatus === 'SUCCESS'  || 
                  lstatus === 'ABORTED'  || 
                  lstatus === 'FAILED' ) {
              apex.region( "loadStatus" ).refresh();
              apex.region( "sales" ).refresh();
              
              if ( lstatus === 'FAILED' ||  
                   lstatus === 'ABORTED' ) {
                  apex.region( "loadError" ).element.show();
                  apex.region( "loadError" ).refresh();
              }
        
              clearInterval( refreshInterval );
              lSpinner$.remove();
            } else {
              apex.region( "loadStatus" ).refresh();
              apex.region( "sales" ).refresh(); 
            }
        };
        
        var refreshInterval = setInterval( triggerRefresh, 1000);

    execution: 
      sequence: 10
      event: Refresh Load Status Timer # 3352991905465115674
      fire-when-event-result-is: True
      fire-on-initialization: false

