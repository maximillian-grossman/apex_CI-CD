- # ====== Validation: Is valid file type ======================
  id: 3346882871429627463
  identification: 
    name: Is valid file type

  execution: 
    sequence: 10

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      if :P16_FILE_TYPE in (
          apex_data_parser.c_file_type_csv,
          apex_data_parser.c_file_type_xlsx,
          apex_data_parser.c_file_type_xml,
          apex_data_parser.c_file_type_json )
      then
          return true;
      else
          :P16_FILE := null;
          return false;
      end if;
    always-execute: false

  error: 
    error-message: Invalid file type. Supported file types are CSV, TXT, XLSX, XML, JSON.
    display-location: Inline with Field and in Notification
    associated-item: P16_FILE # 3346879982115627458

