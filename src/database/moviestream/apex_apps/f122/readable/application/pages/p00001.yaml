- # ====== Region: About This Application ======================
  id: 5989206824486200774
  identification: 
    name: About This Application
    type: Static Content

  source: 
    html-code: |
      <p>This application highlights Application Data Loading functionality in Oracle Application Express (APEX).   You can define a data loading definition to allow end users to upload data into an existing table or a collection.</p>
      
      <ul>
      <li>Application Data Loading Supports CSV, XLSX, XML, and JSON formats.</li>
      <li>Column mapping occurs at design time, removing the burden for end users.</li>
      <li>Flexible column mappings based on simple names or regular expressions.</li>
      <li>Data conversion with transformation rules or lookup queries.</li>
      <li>Easy work flow for end users: upload the file, verify the preview, and load data.</li>
      <li>CSV, XLSX, XML, and JSON data formats can be loaded to tables or collections.</li>
      <li>Configure data loading to Append, Merge or Replace data, with or without Error Handling.</li>
      <li>Simple new Process Type <strong>Data Loading</strong>: Customize Data Loading pages as you wish.</li>
      <li><strong>APEX_DATA_LOADING</strong> PL/SQL API available for custom processing.</li>
      <li>Maximum number of columns to load is 300. Note that Legacy data load supports up to 45.</li>
      </ul>

  layout: 
    sequence: 10
    parent-region: No Parent
