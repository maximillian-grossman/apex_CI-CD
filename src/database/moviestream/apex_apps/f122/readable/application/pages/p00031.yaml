- # ====== Region: Parsed Data =================================
  id: 3728878682304033545
  identification: 
    name: Parsed Data
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      -- The APEX_DATA_PARSER.PARSE function allows to "select" up to 300 columns (COL001 to COL300) from the
      -- parsed file. This example uses the following parameters.
      --
      --     P_CONTENT             the file content to be parsed as a BLOB
      --     P_FILE_NAME           the name of the file; only used to derive the file type. 
      --     P_ADD_HEADERS_ROW     add the detected attribute names for XML or JSON files as the first row
      --     P_XLSX_SHEET_NAME     For XLSX workbooks. The name of the worksheet to parse. If omitted or NULL, the function will
      --                           use the first worksheet found.
      --      
      select line_number, col001, col002, col003, col004, col005, col006, col007, col008, col009, col010
             -- more columns (col011 to col300) can be selected here.
        from apex_application_temp_files f, 
             table( apex_data_parser.parse(
                        p_content                     => f.blob_content,
                        p_add_headers_row             => 'N',
                        p_xlsx_sheet_name             => :P31_XLSX_WORKSHEET,
                        p_max_rows                    => 500,
                        p_store_profile_to_collection => 'FILE_PARSER_COLLECTION',
                        P_SKIP_ROWS =>  1,
                        p_file_name                   => f.filename ) ) p
       where f.name = :P31_FILE
       and line_number > 1
    page-items-to-submit: 
    - P31_XLSX_WORKSHEET
    - P31_FILE

  order-by: 
    type: None

  layout: 
    sequence: 40
    parent-region: Parsed Data # 3551993515993932255
    slot: SUB_REGIONS
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Standard
    template-options: 
    - '#DEFAULT#'
    - t-Region--hideHeader js-addHiddenHeadingRoleDesc
    - t-Region--noBorder
    - t-Region--scrollBody
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    static-id: parsed-data
    region-display-selector: false
    exclude-title-from-translation: false

  header-and-footer: 
    header-text: Showing the first 10 columns only. Adjust the report SQL Query to show more columns.

  server-cache: 
    caching: Disabled

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    layout: 
      number-of-rows-type: Static Value
      number-of-rows: 50

    appearance: 
      template-type: Theme
      template: Standard
      template-options: 
      - '#DEFAULT#'
      - t-Report--stretch
      - t-Report--staticRowColors
      - t-Report--rowHighlight
      - t-Report--horizontalBorders

    pagination: 
      type: No Pagination (Show All Rows)
      partial-page-refresh: true

    performance: 
      lazy-loading: false

    messages: 
      when-no-data-found: No data parsed. Please upload a file.

    break-formatting: 
      break-columns: No Break

    advanced: 
      strip-html: false
      sort-nulls: First

    heading: 
      type: PL/SQL Function Body
      pl/sql-function-body: |
        declare
            l_col_headers varchar2(32000);
        begin
            select p.line_number || ':' || p.col001 || ':' || p.col002 || ':' || p.col003 || ':' || p.col004 || ':' || p.col005 || ':' || 
                   p.col006 || ':' || p.col007 || ':' || p.col008 || ':' || p.col009 || ':' || p.col010
              into l_col_headers
              from apex_application_temp_files f, 
                   table( apex_data_parser.parse(
                          p_content                     => f.blob_content,
                          p_add_headers_row             => 'Y',
                          p_xlsx_sheet_name             => :P31_XLSX_WORKSHEET,
                          p_max_rows                    => 500,
                          p_store_profile_to_collection => 'FILE_PARSER_COLLECTION',
                          p_file_name                   => f.filename ) ) p
             where f.name = :P31_FILE
             and p.line_number = 1;
        
            return l_col_headers;
        end;

    download: 
      csv-export-enabled: true
      link-text: Download

    printing: 
      enabled: false

