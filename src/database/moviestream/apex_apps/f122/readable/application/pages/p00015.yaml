  client-side-condition: 
    type: Item is not null
    item: P15_FILE

  actions: 
  - # ====== Action: Submit Page =================================
    id: 3345855781057701830
    identification: 
      action: Submit Page

    settings: 
      show-processing: true

    execution: 
      sequence: 10
      event: Upload a File # 3345855325753701830
      fire-when-event-result-is: True
      fire-on-initialization: false

validations: 
- # ====== Validation: Is valid file type ======================
  id: 3345857482561701831
  identification: 
    name: Is valid file type

  execution: 
    sequence: 10

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      if apex_data_parser.assert_file_type(
             p_file_name => :P15_FILE_NAME,
             p_file_type => apex_data_parser.c_file_type_csv )
      then
          return true;
      else
          :P15_FILE := null;
          return false;
      end if;
    always-execute: false

  error: 
    error-message: Invalid file type. Supported file types CSV, TXT.
    display-location: Inline with Field and in Notification
    associated-item: P15_FILE # 3345854465468701828

computations: 
- # ====== Computation: P15_FILE_NAME ==========================
  id: 3345857125168701831
  identification: 
    item-name: P15_FILE_NAME

  execution: 
    sequence: 10
    point: After Submit

  computation: 
    type: SQL Query (return single value)
    sql-query: |
      select filename
        from apex_application_temp_files 
       where name = :P15_FILE

  server-side-condition: 
    type: Item is NOT NULL
    item: P15_FILE

