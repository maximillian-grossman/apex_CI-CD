- # ====== Region: Preview =====================================
  id: 3345857763723701832
  identification: 
    name: Preview
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select p.line_number,
             p.col001, p.col002, p.col003, p.col004, p.col005, p.col006, p.col007, p.col008, p.col009, p.col010
             -- add more columns (col011 to col300) here.
        from apex_application_temp_files f, 
             table( apex_data_parser.parse(
                        p_content          => f.blob_content,
                        p_file_name        => f.filename,
                        p_add_headers_row   => 'Y',
                        p_csv_enclosed      => '"',
                        p_file_charset      => 'WE8ISO8859P1',
                        p_max_rows         => 10 ) ) p
       where f.name = :P15_FILE
       and p.line_number > 1;
    page-items-to-submit: 
    - P15_FILE

  order-by: 
    type: None

  layout: 
    sequence: 50
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Standard
    template-options: 
    - '#DEFAULT#'
    - t-Region--noPadding
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  server-side-condition: 
    type: Item is NOT NULL
    item: P15_FILE

  server-cache: 
    caching: Disabled

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    layout: 
      number-of-rows-type: Static Value
      number-of-rows: 50

    appearance: 
      template-type: Theme
      template: Standard
      template-options: 
      - '#DEFAULT#'
      - t-Report--stretch
      - t-Report--staticRowColors
      - t-Report--rowHighlight
      - t-Report--horizontalBorders
      - t-Report--hideNoPagination

    pagination: 
      type: Row Ranges X to Y (with next and previous links)
      display-position: Bottom - Right
      partial-page-refresh: true

    performance: 
      lazy-loading: false
      maximum-rows-to-process: 500

    messages: 
      when-no-data-found: no data found

    break-formatting: 
      break-columns: No Break

    advanced: 
      strip-html: false
      sort-nulls: Last

    heading: 
      type: PL/SQL Function Body
      pl/sql-function-body: |
        declare
            l_col_headers varchar2(32767);
        begin
            select p.line_number || ':' || 
               p.col001 || ':' || p.col002 || ':' || p.col003 || ':' || p.col004 || ':' || p.col005 || ':' || 
               p.col006 || ':' || p.col007 || ':' || p.col008 || ':' || p.col009 || ':' || p.col010
            into l_col_headers
               -- add more columns (col011 to col300) here.
              from apex_application_temp_files f, 
                   table( apex_data_parser.parse(
                              p_content          => f.blob_content,
                              p_file_name        => f.filename,
                              p_add_headers_row   => 'Y',
                              p_csv_enclosed      => '"',
                              p_file_charset      => 'WE8ISO8859P1',
                              p_max_rows         => 10 ) ) p
             where f.name = :P15_FILE
             and p.line_number = 1;
        
            return l_col_headers;
        end;

    download: 
      csv-export-enabled: false

    printing: 
      enabled: false

