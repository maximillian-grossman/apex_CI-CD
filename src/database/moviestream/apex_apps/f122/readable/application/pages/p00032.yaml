- # ====== Region: Page Instructions ===========================
  id: 4526800918441358091
  identification: 
    name: Page Instructions
    type: Static Content

  source: 
    html-code: |
      <p>
      This page uploads data into an existing table (<strong>EBA_DEMO_LOAD_EMP</strong>) using a SQL INSERT statement and the <strong>APEX_DATA_PARSER.PARSE</strong> PL/SQL function. Unlike using the APEX Data Loading wizard, this approach allows to implement "single-step" data loading, without any further end user interaction. On the other hand, uploaded data has to match the target table structure.
      After load, table contents can be reviewed below. Failed rows will be placed into the <strong>EBA_DEMO_LOAD_EMP_ERR$</strong> table, which can be reviewed in report at the bottom of the page.</p>
      <p><a href="javascript:set_item();">Click here</b></a> to copy and paste, or select the text below and paste it into the <b>Copy and Paste Delimited Data</b> section. One row (<code>9000,DOE,MARKERING_ANALYST...</code>) is supposed to be rejected; it will show up as <strong>Failed Row</strong> after loading.
      </p>
      <pre>
      &P32_SAMPLE_DATA.
      </pre>

  layout: 
