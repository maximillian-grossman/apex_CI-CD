validations: 
- # ====== Validation: Is valid file type ======================
  id: 3349104860617829672
  identification: 
    name: Is valid file type

  execution: 
    sequence: 10

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      if apex_data_parser.assert_file_type(
             p_file_name => :P17_FILE_NAME,
             p_file_type => apex_data_parser.c_file_type_csv ) or
         lower( :P17_FILE_NAME ) like '%.zip'
      then
          return true;
      else
          :P17_FILE := null;
          return false;
      end if;
    always-execute: false

  error: 
    error-message: Invalid file type. Supported file types CSV, TXT, ZIP.
    display-location: Inline with Field and in Notification
    associated-item: P17_FILE # 3349102026588829649

computations: 
- # ====== Computation: P17_FILE_NAME ==========================
  id: 3349104494472829663
  identification: 
    item-name: P17_FILE_NAME

  execution: 
    sequence: 10
    point: After Submit

  computation: 
    type: SQL Query (return single value)
    sql-query: |
      select filename
        from apex_application_temp_files 
       where name = :P17_FILE

  server-side-condition: 
    type: Item is NOT NULL
    item: P17_FILE

processes: 
- # ====== Process: Load Data Background =======================
  id: 1843305644969732273
  identification: 
    name: Load Data Background
    type: Execution Chain
    execution-chain: None

  settings: 
    run-in-background: true
    return-id-into-item: P17_LOAD_EXEC_ID
    temporary-file-handling: Move
    temporary-file-items: 
    - P17_FILE
    executions-limit: 1
    submit-immediately: true

  serialization: 
