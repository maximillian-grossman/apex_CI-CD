  id: 1843305842318732275
  identification: 
    name: Load Data
    type: Data Loading
    execution-chain: Load Data Background # 1843305644969732273

  settings: 
    data-load-definition: Sales Data Load # 3354384084115221396
    source-data-type: SQL Query
    sql-query: select eba_demo_data_load.get_file_blob from sys.dual
    processed-row-count-item: 
