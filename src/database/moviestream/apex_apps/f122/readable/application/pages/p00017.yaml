    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: LOAD # 3349099954707829640
    type: Item is NOT NULL
    item: P17_FILE

- # ====== Process: Unpack ZIP Archive =========================
  id: 1843305712704732274
  identification: 
    name: Unpack ZIP Archive
    type: Execute Code
    execution-chain: Load Data Background # 1843305644969732273

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      declare
          l_file      blob;
          l_mime_type apex_application_temp_files.mime_type%type;
      begin
          select mime_type,
                 blob_content
            into l_mime_type,
                 l_file
            from apex_application_temp_files
           where name = :P17_FILE;
      
          if l_mime_type = 'application/zip' then
              l_file := eba_demo_data_load.zip_to_csv( p_blob_content => l_file, p_mime_type => l_mime_type );
          end if;
      
          eba_demo_data_load.set_file_blob( l_file );
      end;

  execution: 
    sequence: 10

