- # ====== Validation: hire date in past =======================
  id: 735523728103586488
  identification: 
    name: hire date in past

  execution: 
    sequence: 20

  validation: 
    editable-region: Other Column Types # 2137517831893531563
    type: Expression
    language: SQL
    sql-expression: 'to_date(:HIREDATE) < SYSDATE'
    always-execute: false

  error: 
    error-message: '#COLUMN_HEADER# must be in the past.'
