- # ====== Region: Overview: Other Column Types ================
  id: 4010422020692909456
  identification: 
    name: 'Overview: Other Column Types'
    type: Static Content

  source: 
    html-code: |
      <p>The Basic Editing and Validation examples have shown a number of the editable column types. This example is the same as the Validation example but uses a few different column types.
      It also has the Fixed Row Height property set to Off for variable height rows.
      </p>
      <ul>
      <li>The Manager column uses a popup LOV</li>
      <li>This time the Hire Date uses a Date Picker that opens on focus.</li>
      <li>The Tags column uses a Shuttle type</li>
      </ul>
      

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Collapsible
    template-options: 
    - '#DEFAULT#'
    - is-expanded
    - t-Region--scrollBody
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: true
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    settings: 
      output-as: HTML
      expand-shortcuts: false

