dynamic-actions: 
- # ====== Dynamic Action: Edit Dialog closed. =================
  id: 1876874685476055870
  identification: 
    name: Edit Dialog closed.

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Dialog Closed
    selection-type: JavaScript Expression
    javascript-expression: window

  client-side-condition: 
    type: JavaScript expression
    javascript-expression: this.data && this.data.dialogPageId === 55

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 1876874750597055871
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: apex.message.showPageSuccess( "Changes successfully saved.");

    execution: 
      sequence: 20
      event: Edit Dialog closed. # 1876874685476055870
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Refresh =====================================
    id: 1876874975823055873
    identification: 
      action: Refresh

    settings: 
      maintain-pagination: false

    affected-elements: 
      selection-type: Region
      region: Department Overview # 2575475047634880904

    execution: 
      sequence: 10
      event: Edit Dialog closed. # 1876874685476055870
      fire-when-event-result-is: True
      fire-on-initialization: false

