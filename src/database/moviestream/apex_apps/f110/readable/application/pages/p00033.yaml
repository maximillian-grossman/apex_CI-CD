  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select EMPNO,
             nvl(FLEX2, 'fa-user') as ICON,
             ENAME,
             JOB,
             MGR,
             HIREDATE,
             SAL,
             COMM,
             ONLEAVE,
             NOTES,
             DEPTNO,
             FLEX1 as PIN,
             FLEX2 as AVATAR,
             FLEX3 as COLOR,
             FLEX4 as TAGS,
             case when JOB = 'MANAGER' or JOB = 'PRESIDENT' then '' else 'UD' end as CTRL
        from EBA_DEMO_IG_EMP

