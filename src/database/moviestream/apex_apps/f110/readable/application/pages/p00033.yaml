- # ====== Region: Overview: Protected Rows ====================
  id: 4009099025157112346
  identification: 
    name: 'Overview: Protected Rows'
    type: Static Content

  source: 
    html-code: |
      <p>This example shows how you can control the ability to update or delete on a per row basis. 
      See the CTRL column that implements a simple rule that managers and presidents cannot be edited or deleted. 
      This column is selected in attribute Edit: Allowed Row Operations Column.
      Remember to set Source: Query Only to Yes for any column that is an expression that cannot be updated.
      </p>
      <p>Rows that cannot be edited are show in a darker color when in edit mode.
      </p>
      

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Collapsible
    template-options: 
    - '#DEFAULT#'
    - is-expanded
    - t-Region--scrollBody
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: true
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    settings: 
      output-as: HTML
      expand-shortcuts: false

