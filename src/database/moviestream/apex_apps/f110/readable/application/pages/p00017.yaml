- # ====== Region: Traditional Paging (Custom) =================
  id: 5401777841827580845
  identification: 
    name: Traditional Paging (Custom)
    type: Interactive Grid

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select ID, RATING, NAME, COUNTRY, TO_CHAR(FROM_YR) as FROM_YR,
              TO_YR,
              LINK, CATEGORY,
              coalesce( to_yr, extract(year from sysdate) ) - FROM_YR as AGE,
              case CATEGORY
                  when 'S_T' then 'fa fa-rocket'
                  when 'P' then 'fa fa-university'
                  when 'A' then 'fa fa-paint-brush'
                  when 'S' then 'fa fa-bicycle'
                  when 'B_L' then 'fa fa-money'
                  else 'fa fa-question'
              end as ICON,
              case CATEGORY
                  when 'S_T' then 'Science & Technology'
                  when 'P' then 'Politics'
                  when 'A' then 'Art'
                  when 'S' then 'Sports'
                  when 'B_L' then 'Business & Law'
                  else 'Undefined'
              end as DISPLAY_CATEGORY,
              GENDER
      
          from EBA_DEMO_IG_PEOPLE
      

  layout: 
    sequence: 30
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Interactive Report
    template-options: 
    - '#DEFAULT#'
    render-components: Above Content

  accessibility: 
