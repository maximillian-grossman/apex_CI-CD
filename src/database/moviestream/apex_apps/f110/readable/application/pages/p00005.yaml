dynamic-actions: 
- # ====== Dynamic Action: Dialog Closed =======================
  id: 1357208297099531563
  identification: 
    name: Dialog Closed

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Dialog Closed
    selection-type: Region
    region: Add Toolbar Button # 2655396794301880200

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 1357208429533531564
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        // make sure it is the dialog we are expecting that closed
        if ( this.data.dialogPageId  === 400 ) {
            if ( this.data.successMessage ) {
                // use this API to show the success message if any that came from the dialog
                apex.message.showPageSuccess(this.data.successMessage.text);
            }
            // refresh the region to pick up any changes made by the dialog that just closed
            apex.region("emp").refresh();
        }
        

    execution: 
      sequence: 10
      event: Dialog Closed # 1357208297099531563
      fire-when-event-result-is: True
      fire-on-initialization: false

