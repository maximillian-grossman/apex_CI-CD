dynamic-actions: 
- # ====== Dynamic Action: update chart ========================
  id: 1357209191970531572
  identification: 
    name: update chart

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: NATIVE_IG|REGION TYPE|interactivegridselectionchange
    selection-type: Region
    region: Multiple Selection # 3958665559963196429

  actions: 
  - # ====== Action: Refresh =====================================
    id: 34260601470068206
    identification: 
      action: Refresh

    settings: 
      maintain-pagination: false

    affected-elements: 
      selection-type: Region
      region: Compare Salary # 1357208654013531566

    execution: 
      sequence: 20
      event: update chart # 1357209191970531572
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Execute JavaScript Code =====================
    id: 1357209337785531573
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        var i, selectedIds = ":",
            model = this.data.model;
        
        for ( i = 0; i < this.data.selectedRecords.length; i++ ) {
            selectedIds += model.getValue( this.data.selectedRecords[i], "EMPNO") + ":";
        }
        $s("P8_SELECTED", selectedIds);
        apex.region("barchart").refresh();

    execution: 
      sequence: 10
      event: update chart # 1357209191970531572
      fire-when-event-result-is: True
      fire-on-initialization: false

    server-side-condition: 
      type: Never

    comments: 
      comments: Update for 24.1. This is the old way of gathering the select item ids. Now all that is needed is a Refresh action

