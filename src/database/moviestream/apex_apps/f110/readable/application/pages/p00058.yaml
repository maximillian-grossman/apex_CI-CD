dynamic-actions: 
- # ====== Dynamic Action: Job = Salesman ======================
  id: 1926016912728514466
  identification: 
    name: Job = Salesman

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Column(s)
    interactive-grid: Dynamic Actions # 2659283559875613394
    column(s): 
    - JOB

  client-side-condition: 
    type: Item / Column = Value
    component-type: Column
    column: JOB
    value: SALESMAN

  actions: 
  - # ====== Action: Enable ======================================
    id: 1926017003337514467
    identification: 
      action: Enable

    affected-elements: 
      selection-type: Column(s)
      column(s): 
      - COMM

    execution: 
      sequence: 10
      event: Job = Salesman # 1926016912728514466
      fire-when-event-result-is: True
      fire-on-initialization: true

  - # ====== Action: Disable =====================================
    id: 1926017026853514468
    identification: 
      action: Disable

    affected-elements: 
      selection-type: Column(s)
      column(s): 
      - COMM

    execution: 
      sequence: 20
      event: Job = Salesman # 1926016912728514466
      fire-when-event-result-is: False
      fire-on-initialization: true

  - # ====== Action: Set Value ===================================
    id: 1926017394971514471
    identification: 
      action: Set Value

    settings: 
      set-type: Static Assignment
      suppress-change-event: false

    affected-elements: 
      selection-type: Column(s)
      column(s): 
      - COMM

    execution: 
      sequence: 30
      event: Job = Salesman # 1926016912728514466
      fire-when-event-result-is: False
      fire-on-initialization: true
      stop-execution-on-error: true
      wait-for-result: true

- # ====== Dynamic Action: MGR changed =========================
  id: 1926017156914514469
  identification: 
    name: MGR changed

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Column(s)
    interactive-grid: Dynamic Actions # 2659283559875613394
    column(s): 
    - MGR

  actions: 
  - # ====== Action: Set Value ===================================
    id: 1926017218135514470
    identification: 
      action: Set Value

    settings: 
      set-type: SQL Statement
      sql-statement: 'select deptno from eba_demo_ig_emp where empno = :MGR'
      items-to-submit: 
      - MGR
      escape-special-characters: true
      suppress-change-event: false

    affected-elements: 
      selection-type: Column(s)
      column(s): 
      - DEPTNO

    execution: 
      sequence: 10
      event: MGR changed # 1926017156914514469
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

