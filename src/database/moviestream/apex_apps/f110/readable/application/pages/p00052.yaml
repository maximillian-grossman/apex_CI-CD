- # ====== Region: Overview: Tooltips ==========================
  id: 3313523576404701631
  identification: 
    name: 'Overview: Tooltips'
    type: Static Content

  source: 
    html-code: |
      <p>The Interactive Grid grid view can integrate with jQuery UI tooltips. 
      See the Advanced: Initialization JavaScript Function attribute for details of how this is done.
      The jQuery UI tooltip options object is passed to the grid view in defaultGridViewOptions.tooltip.
      The items option is not needed because it is set automatically. The content
      callback option receives extra arguments to make it easy to access information
      from the data model. Tooltips are also used to show errors and warnings at the 
      row and cell level so the content function is not called if there is an error
      message to display.
      </p>
      <p>In this example there is a tip on the row header that tells you if
      the row has been added, changed, or deleted. On data cells the tip will
      tell you if the cell has been changed. On the Name cells the hire date
      is shown. On the Notes column the full text of the note is shown in the tip.
      </p>

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Collapsible
    template-options: 
    - '#DEFAULT#'
    - is-expanded
    - t-Region--scrollBody
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: true
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    settings: 
      output-as: HTML
      expand-shortcuts: false

