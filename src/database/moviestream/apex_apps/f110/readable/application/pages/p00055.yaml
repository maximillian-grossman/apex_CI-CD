- # ====== Region: Overview: Editing in a Dialog ===============
  id: 6304265196621728655
  identification: 
    name: 'Overview: Editing in a Dialog'
    type: Static Content

  source: 
    html-code: <p>This page shows the interactive grid within a modal dialog. Note that in a dialog, end users expect the "Save" button to be in the dialog footer, so it has been removed from the interactive grid. After row processing, we don't branch to another page, a <strong>Close Dialog</strong> process is being executed instead.</p>

  layout: 
