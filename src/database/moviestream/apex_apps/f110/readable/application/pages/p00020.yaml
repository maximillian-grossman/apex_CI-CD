- # ====== Region: Overview: Load More Paging ==================
  id: 5942461260357624619
  identification: 
    name: 'Overview: Load More Paging'
    type: Static Content

  source: 
    html-code: |
      <p>Load more scroll paging is very similar to progressive scroll paging but rather than 
      automatically adding more rows as the user scrolls near the end there is a "Show More" button to explicitly add more rows. 
      To use load more paging set the Pagination: Type to Scroll and Show Total Row Count to No and
      set advanced JavaScript configuration pagination.loadMore to true (see Advanced: Initialization JavaScript Function attribute).
      Note that load more scroll paging applies to Icon and Details views as well.
      </p>
      

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Collapsible
    template-options: 
    - '#DEFAULT#'
    - is-expanded
    - t-Region--scrollBody
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: true
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    settings: 
      output-as: HTML
      expand-shortcuts: false

