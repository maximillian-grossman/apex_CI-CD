- # ====== Region: About this Application ======================
  id: 3970841979042879739
  identification: 
    name: About this Application
    type: Static Content

  source: 
    html-code: |
      <h2>About this Application</h2>
      <p><b>Sample Interactive Grid</b> explores the many uses and features of the Oracle Application Express Interactive Grid.
      </p>
      <h3>About the data used</h3>
      <p>Most of the examples in this application use a modified EMP table called EBA_DEMO_IG_EMP and DEPT table called EBA_DEMO_IG_DEPT. Each of these tables have a few extra columns that are helpful in demonstrating the editing capabilities of Interactive Grid.
      </p>
      <p>To demonstrate various paging strategies and how larger datasets are handled another table called EBA_DEMO_IG_PEOPLE is used. This table is based on data from the <a target='_blank' href='http://pantheon.media.mit.edu/methods'>Pantheon dataset</a>: <i>Yu, A. Z., et al. (2016). Pantheon 1.0, a manually verified dataset of globally famous biographies. Scientific Data 2:150075. doi: 10.1038/sdata.2015.75</i>. It is a list of important historical people. The rating column is the Historical Popularity Index (see the web site for details of how this is calculated). The data is a subset of the Pantheon dataset with additional data, specifically death date and Wikipedia URL, extracted from Wikipedia.
      </p>

  layout: 
