- # ====== Process: Create Oracle Text Index ===================
  id: 1176214360443069768
  identification: 
    name: Create Oracle Text Index
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          eba_demo_ig_text_pkg.drop_text_preferences;
          eba_demo_ig_text_pkg.create_text_preferences;
          eba_demo_ig_text_pkg.create_text_index;
      end;
      

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  security: 
    authorization-scheme: Oracle Text is available # 1176167065401001527

