    type: Interactive Grid

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select ID,
             RATING,
             NAME,
             COUNTRY,
             TO_CHAR(FROM_YR) as FROM_YR,
             case when TO_YR = 0 then '' else TO_CHAR(TO_YR) end as TO_YR, 
             gender
