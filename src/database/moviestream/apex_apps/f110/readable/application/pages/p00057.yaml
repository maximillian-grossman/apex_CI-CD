- # ====== Process: Maintain log ===============================
  id: 1881705052860092983
  identification: 
    name: Maintain log
    type: Execute Code
    execution-chain: None
    editable-region: Basic Editing # 4455367815759016366

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
        if not apex_collection.collection_exists( p_collection_name => 'IG_OPERATIONS' ) then
           apex_collection.create_collection( p_collection_name => 'IG_OPERATIONS' );
        end if;
      
        apex_collection.add_member(
            p_collection_name => 'IG_OPERATIONS', 
            p_d001 => sysdate,
            p_c001 => :EMPNO,
            p_c002 => :ENAME,
            p_c003 => :JOB,
            p_c004 => :HIREDATE,
            p_c005 => :SAL,
            p_c006 => :COMM,
            p_c007 => :MGR,
            p_c008 => :DEPTNO,
            p_c009 => :ONLEAVE, 
            p_c010 => :NOTES,
            p_c011 => :RATING, 
            p_c012 => :APEX$ROW_STATUS
        );
       end;
      
      

  execution: 
    sequence: 20
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    execution-scope: For Created and Modified Rows

