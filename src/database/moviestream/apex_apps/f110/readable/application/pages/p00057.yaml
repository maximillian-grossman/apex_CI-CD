- # ====== Region: Overview: Custom Server Processing ==========
  id: 6328272004558394259
  identification: 
    name: 'Overview: Custom Server Processing'
    type: Static Content

  source: 
    html-code: |
      <p>This page shows how to use custom PL/SQL logic for processing submitted rows. Instead of the standard "Save Interactive Grid Data" processes you can create your own PL/SQL process which does custom logic. Make sure to set the Editable Grid attribute to the Interactive Grid region you want the process to work on.  Your code will be called for each submitted row. The column values are available as bind variables using colon syntax (e.g. :EMPNO).</p>
      <p>This example page contains the standard process as well as a custom PL/SQL process. While the standard process maintains the base table, the custom logic maintains a DML log within an APEX collection. So, within one APEX session, the log shows which changes have been made to the interactive grid. For a new session, the log will be cleared. Of course, such a log could also be maintained in a persistent table.</p>

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Collapsible
    template-options: 
    - '#DEFAULT#'
    - is-expanded
    - t-Region--scrollBody
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: true
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    settings: 
      output-as: HTML
      expand-shortcuts: false

