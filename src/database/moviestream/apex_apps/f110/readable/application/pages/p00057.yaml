  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select 
          case when c012 = 'D' then 'Delete'
               when c012 = 'C' then 'Create'
               when c012 = 'U' then 'Update' end as operation,
          d001 as time_stamp,
          c001 as empno,
          c002 as ename,
          c003 as job,
          c004 as hiredate,
          c005 as sal,
          c006 as comm,
          c007 as mgr,
          c008 as deptno,
          c009 as onleave,
          c010 as notes,
          c011 as rating
      from apex_collections
      where collection_name = 'IG_OPERATIONS'
      order by d001 desc    
      
      

