dynamic-actions: 
- # ====== Dynamic Action: Validate SAL ========================
  id: 737904322628638667
  identification: 
    name: Validate SAL

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Column(s)
    interactive-grid: Client Validation # 2143918771242982965
    column(s): 
    - SAL

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 737904467921638668
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        var sal = apex.item("cSal"),
            num = sal.getValue();
        if ( num !== "" && (parseFloat(num) != num || num < 0 || num > 10000)) {
            sal.node.setCustomValidity("invalid number"); // this message is only shown if there is no data-valid-message attribute on the column item
        } else {
            sal.node.setCustomValidity(""); // clear the error
        }

    execution: 
      sequence: 10
      event: Validate SAL # 737904322628638667
      fire-when-event-result-is: True
      fire-on-initialization: true

- # ====== Dynamic Action: Validate COMM =======================
  id: 737904593616638669
  identification: 
    name: Validate COMM

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Column(s)
    interactive-grid: Client Validation # 2143918771242982965
    column(s): 
    - COMM

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 737904642082638670
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        var comm = apex.item("cComm"),
            num = comm.getValue();
        if ( num !== "" && (parseFloat(num) != num || num < 0 || num > 10000)) {
            comm.node.setCustomValidity("invalid number"); // this message is only shown if there is no data-valid-message attribute on the column item
        } else {
            comm.node.setCustomValidity(""); // clear the error
        }
        

    execution: 
      sequence: 10
      event: Validate COMM # 737904593616638669
      fire-when-event-result-is: True
      fire-on-initialization: true

- # ====== Dynamic Action: Validate comm limit =================
  id: 737904922743638673
  identification: 
    name: Validate comm limit

  execution: 
    sequence: 30
    event-scope: Static
    type: Immediate

  when: 
    event: Custom
    custom-event: apexendrecordedit
    selection-type: Region
    region: Client Validation # 2143918771242982965

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 737905108716638674
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        var validity, message,
            ui = this.data,
            sal = $v("cSal"),
            comm = $v("cComm");
        
        if ( comm == "" || comm < 1.5 * sal ) {
            validity = "valid";
        } else {
            validity = "error";
            // use apex.lang api if you want to localize this message
            message = "Commission must be less than 1.5 times the Salary";
        }
        // passing null for the field set the error on the whole row/record
        ui.model.setValidity(validity, ui.recordId, null, message);
        

    execution: 
      sequence: 10
      event: Validate comm limit # 737904922743638673
      fire-when-event-result-is: True
      fire-on-initialization: false

