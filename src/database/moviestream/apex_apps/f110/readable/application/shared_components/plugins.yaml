    examples: 
      demo-value: 5 minutes ago

  - # ====== Custom Attribute: Attributes ========================
    id: 43432261457509655
    identification: 
      static-id: ATTRIBUTES
      attribute: 4
      name: Attributes
      scope: Component

    layout: 
