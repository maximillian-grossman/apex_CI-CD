- # ====== Region: About this Page =============================
  id: 3672955037081923175
  identification: 
    name: About this Page
    type: Static Content

  source: 
    html-code: |
      <p>
      This application showcases how to access external REST services from Oracle Application Express pages. Particular focus is on the new REST service capabilities in Application Express 18.1 and higher. The <strong>Oracle on Github</strong> page illustrates how to declaratively create Application Express components like reports, charts or calendars based on REST services.</p>
      <p>The <strong>Web Sources and PL/SQL</strong> page shows how declarative Web Sources can be used from within PL/SQL code. That provides great flexibility when working with the data, without having to care for the details of JSON response parsing - Application Express is still responsible for that.
      </p>
      <p>
       It is recommended to first test the URL endpoint used by this application. Go to <strong>Administration</strong> &gt; <strong>Test Service Endpoint</strong> to do this. After a successful test, the REST service demonstration pages can be explored.</p>

