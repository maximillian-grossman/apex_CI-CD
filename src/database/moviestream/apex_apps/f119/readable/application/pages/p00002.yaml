- # ====== Region: About this page =============================
  id: 6704002870795223783
  identification: 
    name: About this page
    type: Static Content

  source: 
    html-code: |
      <p>This page shows how to parse and display JSON data from a REST service in an Application Express interactive report.</p>
      <p>First, a PL/SQL process firing on page load, fetches JSON data from the REST service with the <strong>APEX_WEB_SERVICE</strong> package and stores it as a CLOB into a collection. The interactive report then parses the CLOB using either SQL/JSON functions (Oracle12c) or XML functions on Oracle11g.</p>

  layout: 
