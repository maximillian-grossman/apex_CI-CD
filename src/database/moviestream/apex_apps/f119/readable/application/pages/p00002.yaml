processes: 
- # ====== Process: Fetch data into Collection =================
  id: 1863920592263935087
  identification: 
    name: Fetch data into Collection
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      declare
          l_response clob;
      begin
          -- load REST response into a collection
          l_response := apex_web_service.make_rest_request(
              p_url              => :SAMPLE_ENDPOINT_URL,
              p_http_method      => 'GET');
      
          apex_collection.create_or_truncate_collection( 'REST_COLLECTION' );
          apex_collection.add_member(
              p_collection_name => 'REST_COLLECTION',
              p_clob001 =>         l_response );
      end;

  execution: 
    sequence: 10
    point: After Header
    run-process: Once Per Page Visit (default)

