- # ====== Region: About this page =============================
  id: 8513099085856469042
  identification: 
    name: About this page
    type: Static Content

  source: 
    html-code: |
      <p>This page shows how to create a report to display a larger REST service response in an Application Express application. Note that it's not feasible to download the full REST service response, since it's simply too large. So, normal Application Express report pagination cannot be used here since it requires all data to be present in the local database. </p>
      <p>This example uses REST pagination support provided by Oracle REST Data Services (ORDS). Each service response contains a link to the next and previous pages. When the <strong>Next Page</strong> or <strong>Previous Page</strong> buttons are clicked, the application page performs another REST request using the link to the next or previous result page, which have been extracted from the response.</p>

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
