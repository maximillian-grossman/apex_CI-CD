- # ====== Region: Data from RESTful Service ===================
  id: 17533008246430258497
  identification: 
    name: Data from RESTful Service
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select 
          x.EMPNO, 
          x.ENAME, 
          x.JOB, 
          x.MGR, 
          to_date( x.HIREDATE, 'YYYY-MM-DD"T"HH24:MI:SS"Z"' ) as HIREDATE, 
          x.SAL, 
          x.COMM,
          x.DEPTNO, 
          x.RN
      from apex_collections c, xmltable(
          '/json/items/row'
          passing apex_json.to_xmltype( c.clob001 )
          columns
              EMPNO      NUMBER          path 'empno',
              ENAME      VARCHAR2(4000)  path 'ename',
              JOB        VARCHAR2(4000)  path 'job',
              MGR        NUMBER          path 'mgr',
              HIREDATE   VARCHAR2(4000)   path 'hiredate',
              SAL        NUMBER          path 'sal', 
              COMM       NUMBER          path 'comm',
              DEPTNO     NUMBER          path 'deptno',
              RN         NUMBER          path 'rn'
      ) x
      where c.collection_name = 'REST_COLLECTION'

  order-by: 
    type: None

  layout: 
    sequence: 40
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: false
    column: Automatic
    new-column: false
    column-span: Automatic

