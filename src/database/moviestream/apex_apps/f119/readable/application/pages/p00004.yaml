- # ====== Region: About this page =============================
  id: 10326874277844926638
  identification: 
    name: About this page
    type: Static Content

  source: 
    html-code: |
      <p>This page shows how to create a report to display larger REST service responses including query capability. Unline a report on a normal page, a new REST request must be executed when end users type in a query. Downloading all data to the database and doing local filtering is not feasible since the amount of data might be too large. </p>
      <p>This example uses REST pagination support provided by Oracle REST Data Services (ORDS). ORDS allows to append a query parameter (<strong>q=</strong>) containing filters to the REST endpoint URL. On the REST server side that parameter is being evaluated leading ORDS returning only the requested row set.</p>

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Blank with Attributes
    template-options: 
    - '#DEFAULT#'
    render-components: Above Content

