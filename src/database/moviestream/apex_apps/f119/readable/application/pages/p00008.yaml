- # ====== Region: Quick Start =================================
  id: 5170661720113614736
  identification: 
    name: Quick Start
    type: Static Content

  source: 
    html-code: |
      <H2>Getting Started</h2>
      <p>Make sure to create the Sample RESTful Service: Navigate to SQL Workshop, RESTful Services and click the "Reset Sample Data" link on the right pane.</p>
      <p>Make sure that the APEX engine user (APEX_050100) can connect to the APEX server via HTTP. A <i>Network ACL</i> is needed. Have a look into the Application Express Installation Guide - chapter "Enabling Network Services in Oracle Database 11g or Later" for more information.</p>
      <p>Run the application as a developer; at the bottom of the page will be buttons for viewing the page in the Application Express Application Builder. Click on the "Edit Page X" button to see how the pages are defined.</p>

  layout: 
