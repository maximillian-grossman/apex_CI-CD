- # ====== Region: About this Application ======================
  id: 5170662120171614737
  identification: 
    name: About this Application
    type: Static Content

  source: 
    html-code: |
      <h2>About this Application</h2>
      
      <p>This example application demonstrates how to access and use an external REST service with Application Express Components. Application Developers can review the components needed to display data from a REST service as a report, to use pagination or to pass filters to the REST service. An example how send data to a REST service is also contained.</p>
      
      <p>The first page, "Simple Report", fetches data from the REST service and displays it as a tabular report. That is a quick and easy way to display small amounts of data from a REST service within an Application Express page.</p>
      
      <p>The second page, "Report with Pagination", does also work with REST services returning large amounts of data. Typically, REST services only return their results page-wise. Each page contains the HTTP url to the next and to the previous page. The Report with Pagination example extracts these URLs from the service response and shows how to add Application Express buttons to navigate between the pages. So it becomes possible to browse through a larger REST response while keeping scalability - each request only contains a reasonable amount of data.</p>
      
      <p>The "Report with Query" page shows how to pass a query filter to the REST service. Again, when REST services return large amounts of data, it's not feasible to fetch all that data to the APEX application and do filtering there. The query filter must be sent to the REST service in order to retrieve only the desired results.</p>
      
      <p>The "Local Rest Data" page shows how to download the complete REST service response to a local table - in order to do extensive reporting and analytics. When REST services return their results pagewise, we have to perform multiple requests in order to download all data into a local table. That page shows how such a process looks like. Clicking a button leads to all data being fetched into the table - the process fetches the next page as long as no further pages exist.</p>
      
      <p>The "DML Form" page shows how to manipulate data by sending a PUT request to the server. The page displays a typicall Application Express form. However, instead of the normal Automatic Fetch Row or Automatic Row Process processes, we  have PL/SQL code which fetches form data from the REST service and which uploads the updated information to the service.</p>

