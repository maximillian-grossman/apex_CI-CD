- # ====== Region: Information =================================
  id: 114994132796917860
  identification: 
    name: Information
    type: Static Content

  source: 
    html-code: |
      <p>This page shows how data from a REST Service can be joined with local data. Each Github repository has a programming language attribute. The (local) table <strong>EBA_RESTDEMO_SAMPLE_LANG</strong> contains information about who created that programming language.</p>
      <p>Using a <strong>Post Processing SQL query</strong>, the local table can be joined to the Web Source result data; the result is a combination of local and remote data.</p>

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

