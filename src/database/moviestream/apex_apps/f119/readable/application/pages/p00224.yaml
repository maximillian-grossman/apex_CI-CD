- # ====== Region: Combine Web Sources and Local Datza =========
  id: 114991403802917833
  identification: 
    name: Combine Web Sources and Local Datza
    type: Interactive Report

  source: 
    location: REST Source
    rest-source: Sample Application - Github Repositories # 762611548379086576

  local-post-processing: 
    type: SQL Query
    sql-query: |
      select ID,
             remote.NAME,
             HOMEPAGE,
             SIZE_,
             LANGUAGE,
             local.created_by
        from #APEX$SOURCE_DATA# remote, eba_restdemo_sample_lang local
       where remote.language = local.name

