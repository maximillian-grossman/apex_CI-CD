- # ====== Region: About this page =============================
  id: 8519515614479260964
  identification: 
    name: About this page
    type: Static Content

  source: 
    html-code: |
      <p>When doing extensive reporting and analysis on data from REST services, it often makes sense to download the data to a local table beforehand.</p>
      <ul>
      <li>The local application becomes independent from REST service availibility</li>
      <li>Savings on network bandwidth or REST Call Rate consumption: A REST request is not being performed for each page visit any more</li>
      <li>Some REST services even don't allow to fetch all their data with one request - clients must fetch the data on a page by page basis.</li>
      </ul>
      <p>This page shows how to first download data from the REST service to a local table - the PL/SQL loading code detects when there is a "next" page and fetches all pages until the end of response has been reached. Then a tabular report and a JET chart visualize data from the local tables..</p>
      

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Blank with Attributes
    template-options: 
    - margin-bottom-lg
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    settings: 
      output-as: HTML
      expand-shortcuts: false

