- # ====== Region: Information =================================
  id: 759227016141536262
  identification: 
    name: Information
    type: Static Content

  source: 
    html-code: |
      <p>This example makes use of the <a href="https://api.github.com/" target="_blank">Github API</a>. In Shared Components, the Web Source <strong>Sample Application - Github Repositories</strong> references all repositories of <strong>oracle</strong> Github user. Further Web Source Modules are available for <em>Commits</em>, <em>Issues</em> and <em>Pull Requests</em>.</p>
      <p>This page renders some important repository attributes as an Interactive Report. The report behaves like a report on a local table; all interactive report features like searching, sorting or computations are available. Clicking on the repository name opens a modal dialog showing repository details as Report, Calendar or Cards view.</p>
      <p>To avoid too many HTTP requests, <em>Caching</em> is enabled for this Web Source Module (Shared Components &gt; Web Source Modules &gt; Github &gt; Operations &gt; Caching).</p>

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

