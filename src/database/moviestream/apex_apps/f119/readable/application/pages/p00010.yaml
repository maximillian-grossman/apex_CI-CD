- # ====== Region: About this Page =============================
  id: 130188837290615831
  identification: 
    name: About this Page
    type: Static Content

  source: 
    html-code: <p>Starting with Application Express 18.1, components like reports, charts or calendards provide native support for Web Services. The APEX_EXEC package PL/SQL package allows to work with a REST service on a higher level, without having the need to fetch and parse JSON data manually. So it's recommended to use these features instead of manual low-level coding with APEX_WEB_SERVICE. Use manual coding only when the native functionality does not meet your requirements.</p>

