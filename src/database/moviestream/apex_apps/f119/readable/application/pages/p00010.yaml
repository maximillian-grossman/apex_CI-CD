computations: 
- # ====== Computation: P10_APEX_OWNER =========================
  id: 762881434839546835
  identification: 
    item-name: P10_APEX_OWNER

  execution: 
    sequence: 10
    point: Before Header

  computation: 
    type: Function Body
    language: PL/SQL
    pl/sql-function-body: |
      declare
          l_owner varchar2(128);
      begin
          begin
              select table_owner 
                into l_owner
                from all_synonyms
               where synonym_name = 'F' 
                 and owner        = 'PUBLIC'
                 and rownum       = 1;
          exception 
              when others then 
                  l_owner := '{APEX Owner}';
          end;
          return l_owner;
      end;

  server-side-condition: 
    type: Item = Value
    item: SAMPLE_SERVICE_AVAILABLE
    value: NO_ACL

