- # ====== Region: Enable Network ACL on Oracle11g =============
  id: 2601078482040723118
  identification: 
    name: Enable Network ACL on Oracle11g
    type: Static Content

  source: 
    html-code: |
      <p>To enable all network conections for the APEX Engine, execute the following while connected as a user with DBA privileges (SYS):</p>
      <pre>
      declare
          acl_path  varchar2(4000);
      begin
          select acl 
            into acl_path 
            from dba_network_acls
           where host = '*' 
             and lower_port is null 
             and upper_port is null;
      
          if dbms_network_acl_admin.check_privilege( acl_path, '&P10_APEX_OWNER.', 'connect' ) is null then
              dbms_network_acl_admin.add_privilege( acl_path,  '&P10_APEX_OWNER.', true, 'connect' );
          end if;
      
      exception
          when no_data_found then
              dbms_network_acl_admin.create_acl(
                  'power_users.xml',
                  'acl that lets power users to connect to everywhere',
                  '&P10_APEX_OWNER.',
                  true, 
                  'connect' );
              dbms_network_acl_admin.assign_acl( 'power_users.xml', '*' );
      end;
      </pre>

  layout: 
    sequence: 50
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Standard
    template-options: 
    - '#DEFAULT#'
    - t-Region--scrollBody
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: true
    exclude-title-from-translation: false

  server-side-condition: 
    type: Expression
    language: PL/SQL
    pl/sql-expression: ":SAMPLE_SERVICE_AVAILABLE = 'NO_ACL' and sys.dbms_db_version.ver_le_11_2 = true"

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    settings: 
      output-as: HTML
      expand-shortcuts: false

