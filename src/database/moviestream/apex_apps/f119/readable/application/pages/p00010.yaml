- # ====== Region: Network Privileges required =================
  id: 2571922621696539314
  identification: 
    name: Network Privileges required
    type: Static Content

  source: 
    html-code: |
      <p>The Oracle Application Express Engine cannot connect to REST services over HTTP, because there is no <em>Network ACL</em> configured for the Application Express engine. In order to make this application work, configure a Network ACL enabling the Application Express Engine user <strong>&P10_APEX_OWNER.</strong> to connect to <strong>&SAMPLE_ENDPOINT_URL.</strong>. See <strong>Enabling Network Services in Oracle Database 11g or Later</strong> within <strong>Oracle Application Express Installation Guide</strong> for more information. Having done that, log out and back into this application.</p>
      

  layout: 
    sequence: 30
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
