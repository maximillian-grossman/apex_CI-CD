- # ====== Region: Enable Network ACL on Oracle12c =============
  id: 2601078376117723117
  identification: 
    name: Enable Network ACL on Oracle12c
    type: Static Content

  source: 
    html-code: |
      <p>To enable all network conections for the APEX Engine, execute the following while connected as a user with DBA privileges (SYS):</p>
      <pre>
      begin
          dbms_network_acl_admin.APPEND_HOST_ACE(
              host => '*',
              ace  => xs$ace_type(
                          privilege_list => xs$name_list('connect'),
                              principal_name => '&P10_APEX_OWNER.',
                              principal_type => xs_acl.ptype_db
                      )
          );
      end;
      </pre>

  layout: 
    sequence: 40
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Standard
    template-options: 
    - '#DEFAULT#'
    - t-Region--scrollBody
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: true
    exclude-title-from-translation: false

  server-side-condition: 
    type: Expression
    language: PL/SQL
    pl/sql-expression: ":SAMPLE_SERVICE_AVAILABLE = 'NO_ACL' and sys.dbms_db_version.ver_le_11_2 = false"

  customization: 
    customizable: Not Customizable By End Users

