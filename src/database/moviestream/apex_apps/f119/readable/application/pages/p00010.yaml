- # ====== Region: Example REST Service not available ==========
  id: 2571922792325539316
  identification: 
    name: Example REST Service not available
    type: Static Content

  source: 
    html-code: |
      <p>The example REST service this application is working on, <strong>oracle.example.hr</strong>, is not configured correctly, has been created with an older Application Express version or does not exist. Please navigate to <strong>SQL Workshop &gt; RESTful Services</strong>. Make sure to use <strong>ORDS Based REST Services</strong>. If your schema is not yet registered with ORDS, register it and ensure that the <strong>Install Sample Service</strong> switch is set to <strong>Yes</strong>.  If the schema is already registered with ORDS, click the <strong>Reset Sample Service</strong> button to re-create the example REST service. Check the following URL in your browser, whether it returns JSON data <strong>{"version": "21.2"}</strong>. Then log out and back into this application.</p>
      <p><a href="&P10_REST_VERSION_URL." target="_blank">&P10_REST_VERSION_URL.</a> </p>
      <p>If the example REST service is accessible under another URL, navigate to the <strong>Administration</strong> page and change the <strong>REST Service URL</strong> to point to your example REST service.</p>

