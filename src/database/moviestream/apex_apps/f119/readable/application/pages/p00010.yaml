  id: 2571922746212539315
  identification: 
    name: SSL Certificate Error
    type: Static Content

  source: 
    html-code: |
      <p>The Oracle Application Express Engine can connect to the REST service endpoint, but cannot validate the server's SSL certificate. Make sure that a wallet is configured for the Application Express instance. See <strong>Configuring Instance Settings</strong> - <strong>Configuring Wallet Information</strong> in the <strong>Application Express Administration Guide</strong> for more information.</p>
      <p>If the example REST service is accessible under another URL, navigate to the <strong>Administration</strong> page in this application, change the <strong>REST Service URL</strong> for this application to work with and log out and back into the application.</p>

