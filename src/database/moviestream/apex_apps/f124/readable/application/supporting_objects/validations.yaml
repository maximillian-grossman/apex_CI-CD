- # ====== Validation: SDO_GEOMETRY is available ===============
  id: 1570307462581868086
  identification: 
    name: SDO_GEOMETRY is available

  execution: 
    sequence: 20

  validation: 
    type: Rows returned
    sql-query: |
      select 1 
        from sys.all_objects
       where owner       = 'MDSYS'
         and object_name = 'SDO_GEOMETRY'
         and object_type = 'TYPE'

  error: 
    error-message: The SDO_GEOMETRY data type is not available in this database.

- # ====== Validation: Database Version is 12.2.0.1 or higher ==
