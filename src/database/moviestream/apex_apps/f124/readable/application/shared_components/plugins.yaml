  - # ====== Custom Attribute: Map Width Interpretation ==========
    id: 1571467298332738658
    identification: 
      static-id: attribute_21
      attribute: 21
      name: Map Width Interpretation
      scope: Component

    layout: 
      sequence: 35

    settings: 
      type: Select List
      lov-type: Static
      common: true
      show-in-wizard: true
      required: true
      translatable: false

    default: 
      value: PERCENT

    help: 
      help-text: |
        <p>The Map Window size can be specified either in <b>Pixels</b> or in <b>Percent</b>. If specified in Pixel, then the map size will be static on all devices and for all screens. If <b>Percent</b> is chosen, the <b>Width</b> will be interpreted in percent of the region width. The Map height will still be in pixels. </p>
        <p><b>100,75<b> means that the map will use 100% of the region width, and the height will be 75% of the map width.
        </p>

    entries: 
    - # ====== Entry: Pixel ========================================
      id: 1571467686653738658
      entry: 
        sequence: 10
        display: Pixel
        return: PIXEL

      advanced: 
        quick-pick: false

    - # ====== Entry: Percent ======================================
      id: 1571468135600738658
      entry: 
        sequence: 20
        display: Percent
        return: PERCENT

      advanced: 
        quick-pick: false

