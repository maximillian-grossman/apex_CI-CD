  information: 
    version: 21.1
    about-url: 'http://apex.oracle.com/plugins'
    help-text: |
      <p>
      	This plugin integrates Oracle Maps as a region into an APEX application. This plugins requires an running installation of Oracle&#39;s Fusion Middleware MapViewer in order to run properly. The Map Tile Layers and Features of Interest to be displayed are being configured as Plugin parameters.</p>
      <p>
      	<br />
      	&nbsp;</p>

  standard-attributes: 
  - # ====== Standard Attribute: SOURCE_SQL ======================
    id: 1571477708644738663
    identification: 
      name: SOURCE_SQL

    value: 
      required: false

    settings: 
      minimum-columns: 3

    examples: 
      examples: |
        <p>The <i>Feature Of Interest</i> (FOI) display style and information text depends on your SQL query. Make sure that it returns the following columns.</p>
        <ul>
        <li><b>ID</b> (Mandatory): Must uniquely identify a row - use the primary key for this. </li>
        <li><b>GEOMETRY</b> (Mandatory): Must be a column of type SDO_GEOMETRY. Currently only point geometries are supported.</li>
        <li><b>STYLE</b> (Mandatory): Determines the marker style: <b>blue|red|green|purple|yellow|gray</b>: Displays the marker as a pin in the given color. <b>IMAGE</b> allows to use custom images as markers. The image will be loaded from the URL given in the <b>IMAGEURL</b> column.</li>
        <li><b>MARKERSIZE</b> (Optional): Provide a value in the form <b>R|C{size})</b> (e.g. R10 or C5). Values starting with a <b>C</b> are rendered as a circle with the specifed radius. Values starting with <b>R</b> are rendered as a rectangle with the specified size. The no MARKERSIZE is given, a pin image will be used as the marker.</li>
        <li><b>IMAGEURL</b> (Optional): Provide a URL to the image you want to use as marker here. You can use APEX Application images with #APP_IMAGES#. Note that images need a transparent background for optimal display.</li>
        <li><b>LAYER</b> (Optional): Assign this row to a layer number from 0 to 9. Layer 9 is the top layer. Use this to determine which FOI are to be layered on top of others. If not given, the row will be assigned to layer 1. Use <b>HEAT</b> as Layer to generate a heat map from the data. A Heat Map is always Layer 0.</li>
        <li><b>INFOTIP</b> (Optional): This column content will be displayed when hovering the marker with the mouse.</li>
        <li><b>INFOTEXT</b> (Optional): If given, the marker will get a clickable information window with the content of this column.</li>
        <li><b>MINZOOM</b> (Optional): Display the FOI only, if the map is zoomed at least to this level. Only supported, when "Lazy Load" is set to <b>Yes</b>.</li>
        <li><b>MAXZOOM</b> (Optional): Display the FOI only unitl the map is zoomed to this level. Only supported, when "Lazy Load" is set to <b>Yes</b>.</li>
        </ul>
        <p>
        SQL Query for simple marker display.
        </p>
        <pre>
        select 
          id, 
          name as infotip,
          'Customer: '||name||'&lt;br/&gt;Revenue: '||revenue as infotext, 
          geometry, 
          case 
            when revenue < 5000 then 'blue' 
            when revenue between 5000 and 10000 then 'red' 
            else 'purple' 
          end as style 
        from customers
        where revenue is not null
        </pre>

