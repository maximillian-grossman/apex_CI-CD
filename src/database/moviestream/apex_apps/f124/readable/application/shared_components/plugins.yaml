- # ====== Plugin: Legacy: Oracle Maps - Get Redline ===========
  id: 1571427667859738631
  identification: 
    name: 'Legacy: Oracle Maps - Get Redline'
    internal-name: COM.ORACLE.APEX.ORAMAPS.GETREDLIN
    type: Dynamic Action

  advanced: 
    category: Miscellaneous
    quick-pick: false

  subscription: 
    version-number: 1089080485

  source: 
    pl/sql-code: |
      function render_da_oramaps_getRedline(
          p_dynamic_action in apex_plugin.t_dynamic_action,
          p_plugin         in apex_plugin.t_plugin )
          return apex_plugin.t_dynamic_action_render_result
      is
          l_type          varchar2(30)   := upper(p_dynamic_action.attribute_01);
