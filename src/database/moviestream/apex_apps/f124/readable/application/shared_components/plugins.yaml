      scope: Component

    layout: 
      sequence: 75

    settings: 
      type: Yes/No
      common: true
      show-in-wizard: true
      required: false
      translatable: false

    default: 
      value: Y

    help: 
      help-text: If set to <b>Yes</b>, the Maps Plugin will store the current map center and zoom level in a cookie. The map will then initialize with the last position after an APEX page refresh.

  - # ====== Custom Attribute: SQL FOI Lazy Loading ==============
    id: 1571466489912738657
    identification: 
      static-id: attribute_19
      attribute: 19
      name: SQL FOI Lazy Loading
      scope: Component

    layout: 
      sequence: 140

    settings: 
      type: Yes/No
      common: true
      show-in-wizard: true
      required: false
      translatable: false

    default: 
      value: N

    condition: 
      depending-on-custom-attribute: Show SQL FOI # 1571465629081738657
      depending-on-condition-type: equal to
      expression: Y
      always-evaluate: true

    help: 
      help-text: Setting Lazy Loading to <b>No</b> lets the plugin load all FOI data at initialization time. Choosing <b>Yes</b> will only load the FOI data for the current map window. For large amounts of FOI data distributed over large areas, choose <b>Yes</b>. <i>Note that you need a spatial index on your SDO_GEOMETRY column in the latter case</i>.

