processes: 
- # ====== Process: Load Full Dataset ==========================
  id: 1578358920692866653
  identification: 
    name: Load Full Dataset
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          eba_sample_map_load_data(
              p_load_from          => :P501_SOURCE,
              p_states_file_name   => :P501_STATES_FILE,
              p_airports_file_name => :P501_AIRPORTS_FILE,
              p_proxy_override     => :P501_PROXY_OVERRIDE );
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  success-message: 
    success-message: Data loaded.

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: LOAD # 1578358823714866652

