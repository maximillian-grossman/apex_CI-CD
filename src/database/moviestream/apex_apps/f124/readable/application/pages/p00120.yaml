dynamic-actions: 
- # ====== Dynamic Action: On Click Point ======================
  id: 806540229752570671
  identification: 
    name: On Click Point

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: NATIVE_MAP_REGION|REGION TYPE|spatialmapobjectclick
    selection-type: Region
    region: Airports Map # 1577000163353524511

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 806540646694570672
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        const { lng, lat } = this.data;
        
        apex.region("airport-map-region").call( "getMapObject" ).flyTo({ 
            center: [ lng, lat ],
            screenSpeed: 0.8
        });

    execution: 
      sequence: 10
      event: On Click Point # 806540229752570671
      fire-when-event-result-is: True
      fire-on-initialization: false

