- # ====== Region: US States ===================================
  id: 1577519099048545465
  identification: 
    name: US States
    type: Map

  source: 
    location: None

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Blank with Attributes
    template-options: 
    - '#DEFAULT#'
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    static-id: airport-map-region
    region-display-selector: true
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    id: 1575910380532909084
    map: 
      background: Default
      height: 640

    controls: 
      navigation-bar: Zoom and Compass
      navigation-bar-position: End
      options: 
      - Scale Bar
      - Infinite Map
      - Rectangle Zoom

    initial-position-and-zoom: 
      type: Static Values
      longitude: '-90'
      latitude: 35
      zoom-level: 3

    legend: 
      show: true
      position: End

    attributes: 
      messages-position: Below
      unit-system: Metric

    performance: 
      lazy-loading: true

    layers: 
    - # ====== Layer: US States ====================================
      id: 1575910741023909169
      identification: 
        name: US States
        layer-type: Polygons

      layout: 
        sequence: 10

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          select ID,
                 NAME,
                 STATE_CODE,
                 to_char(LAND_AREA / 1000000,'9G999G999G990D000')  land_area,
                 to_char(WATER_AREA / 1000000,'9G999G999G990D000')  water_area,
                 case when water_area > 50000000000 then 50000000000 else water_area end as water_area_color,
                 geometry
            from EBA_SAMPLE_MAP_SIMPLE_STATES
        use-spatial-index: false

      column-mapping: 
        geometry-column-data-type: SDO_GEOMETRY
        geometry-column: GEOMETRY
        primary-key-column: ID

      appearance: 
        use-color-scheme: true
        color-scheme: Sequential
        scheme-name: Blue to Yellow
        color-value-column: WATER_AREA_COLOR
        fill-opacity: 0.7
        stroke-color: '#101010'

      tooltip: 
        advanced-formatting: false
        column: NAME

      info-window: 
        advanced-formatting: true
        html-expression: |
          <strong>&NAME. (&STATE_CODE.)</strong><br>
          Land Area: &LAND_AREA. km&sup2;<br>
          Water Area: &WATER_AREA. km&sup2;<br>

      legend: 
        show: true
        enable-to-hide: true

      messages: 
        when-no-data-found: No States found.

dynamic-actions: 
- # ====== Dynamic Action: On Click Point ======================
  id: 806548439209809248
  identification: 
    name: On Click Point

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: NATIVE_MAP_REGION|REGION TYPE|spatialmapobjectclick
    selection-type: Region
    region: US States # 1577519099048545465

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 806548830107809249
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        const { lng, lat } = this.data;
        
        apex.region("airport-map-region").call( "getMapObject" ).flyTo({ 
            center: [ lng, lat ],
            screenSpeed: 0.8
        });

    execution: 
      sequence: 10
      event: On Click Point # 806548439209809248
      fire-when-event-result-is: True
      fire-on-initialization: false

