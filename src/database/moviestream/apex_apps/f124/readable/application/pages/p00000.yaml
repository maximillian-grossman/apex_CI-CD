- # ====== Region: Only minimal data is installed ==============
  id: 2369661116010880525
  identification: 
    name: Only minimal data is installed
    type: Static Content

  source: 
    html-code: '<p>Only the minimal dataset is currently installed in this application, so demo pages are limited. To install the full <strong>Airports</strong> and <strong>US States</strong> data, navigate to the <a href="f?p=&APP_ID.:501:&SESSION.::&DEBUG."><strong><span class="fa fa-download"></span> Data Loading</strong></a> page.</p>'

  layout: 
    sequence: 5
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Alert
    template-options: 
    - '#DEFAULT#'
    - t-Alert--horizontal
    - t-Alert--defaultIcons
    - t-Alert--warning
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  server-side-condition: 
    type: No Rows returned
    sql-query: |
      select 1 from eba_sample_map_states
      union all
      select 1 from sys.dual where :APP_PAGE_ID in ( 501,9999 )

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    settings: 
      output-as: HTML
      expand-shortcuts: false

buttons: 
- # ====== Button: RESET =======================================
  id: 805987289991959767
  identification: 
    button-name: RESET
    label: Reset

  layout: 
    sequence: 20
    region: Breadcrumb # 2355183043372782721
    slot: NEXT
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    button-template: Text with Icon
    hot: false
    template-options: 
    - '#DEFAULT#'
    - t-Button--iconLeft
    icon: fa-refresh

  behavior: 
    action: Redirect to Page in this Application
    target: 
      url: 'f?p=&APP_ID.:&APP_PAGE_ID.:&SESSION.::&DEBUG.:RR,&APP_PAGE_ID.::'
      page: '&APP_PAGE_ID.'
      clear-cache: RR,&APP_PAGE_ID.

    warn-on-unsaved-changes: Do Not Check

  server-side-condition: 
    type: Current Page is NOT in comma delimited list
    pages: 
    - 501
    - 9999

