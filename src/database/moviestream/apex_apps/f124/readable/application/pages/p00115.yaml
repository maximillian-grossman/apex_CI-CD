    layers: 
    - # ====== Layer: Large Airports ===============================
      id: 1568719196417744785
      identification: 
        name: Large Airports
        layer-type: Points

      layout: 
        sequence: 20

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          select
              ID,
              IATA_CODE,
              AIRPORT_TYPE,
              AIRPORT_NAME,
              CITY,
              STATE_NAME,
              --ACTIVATION_DATE,
              to_char(ACTIVATION_DATE_DT,'fmDDfm-MON-YYYY') as ACTIVATION_DATE,
              ELEVATION,
              DIST_CITY_TO_AIRPORT,
              LAND_AREA_COVERED,
              COMMERCIAL_OPS,
              to_char(COMMERCIAL_OPS,'999G999G999G999') as com_ops_fmtd,
              AIR_TAXI_OPS,
              to_char(AIR_TAXI_OPS,'999G999G999G999') as air_ops_fmtd,
              GEOMETRY
          from 
              eba_sample_map_airports
          where
              commercial_ops > 50000
        use-spatial-index: false

      column-mapping: 
        geometry-column-data-type: SDO_GEOMETRY
        geometry-column: GEOMETRY
        primary-key-column: ID

      point-objects: 
        style: SVG
        shape: Airport
        shape-scale: 1.5

      appearance: 
        fill-color: '#ff0000'
        stroke-color: '#ffffff'

      point-clustering: 
        enable: false

      tooltip: 
        advanced-formatting: true
        html-expression: '&AIRPORT_NAME. (&IATA_CODE.)'

      info-window: 
        advanced-formatting: true
        html-expression: |
          <h3>&AIRPORT_NAME. (&IATA_CODE.)</h3>
          <p><strong>&CITY., &STATE_NAME.</strong><br>
          {if ACTIVATION_DATE/}
          Activation Date: &ACTIVATION_DATE.<br>
          {endif/}
          {if COMMERCIAL_OPS/}
          Commercial Operations: &COM_OPS_FMTD.<br>
          {endif/}
          {if AIR_TAXI_OPS/}
          Taxi Operations: &AIR_OPS_FMTD.<br>
          {endif/}

      legend: 
        show: true
        enable-to-hide: true

    - # ====== Layer: US States ====================================
      id: 1571323370493496805
      identification: 
        name: US States
        layer-type: Polygons

      layout: 
        sequence: 10

      source: 
        location: Local Database
        type: Table / View
        table-owner: Parsing Schema
        table-name: EBA_SAMPLE_MAP_SIMPLE_STATES
        include-rowid-column: false
        use-spatial-index: false

      column-mapping: 
        geometry-column-data-type: SDO_GEOMETRY
        geometry-column: GEOMETRY
        primary-key-column: ID

      appearance: 
        use-color-scheme: false
        fill-color: '#808080'
        fill-opacity: 0.5
        stroke-color: '#ffffff'

      tooltip: 
        advanced-formatting: false
        column: NAME

      info-window: 
        advanced-formatting: false

      legend: 
        show: true
        enable-to-hide: true

      messages: 
        when-no-data-found: No States found.

dynamic-actions: 
- # ====== Dynamic Action: On Click Point ======================
  id: 806553405821841214
  identification: 
    name: On Click Point

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: NATIVE_MAP_REGION|REGION TYPE|spatialmapobjectclick
    selection-type: Region
    region: States and Large Airports # 1588771844208088911

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 806553781249841215
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        const { lng, lat } = this.data;
        
        apex.region("airport-map-region").call( "getMapObject" ).flyTo({ 
            center: [ lng, lat ],
            screenSpeed: 0.8
        });

    execution: 
      sequence: 10
      event: On Click Point # 806553405821841214
      fire-when-event-result-is: True
      fire-on-initialization: false

