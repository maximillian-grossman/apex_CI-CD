dynamic-actions: 
- # ====== Dynamic Action: Refresh Selected Airports Classic Rep
  id: 804044299989118868
  identification: 
    name: Refresh Selected Airports Classic Report

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: NATIVE_MAP_REGION|REGION TYPE|spatialmapchanged
    selection-type: Region
    region: US Airports # 1578990788728068984

  client-side-condition: 
    type: JavaScript expression
    javascript-expression: this.data && this.data.changeType === "toggle-layer"

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 804044327211118869
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        // the "map-changed" event sends the type of change as the "changeType" attribute. "toggle-layer" indicates
        // that the layer visibility has been toggled by clicking the layer entry in the legend.
        // so "copy" the layer visibility information from the dynamic action "payload" object to the
        // P122_LARGE_VISIBLE and P122_SMALL_VISIBLE page items, which are then picked up by the
        // report query.
        for ( l = 0; l < this.data.layers.length; l++) {
            if ( this.data.layers[ l ].name === "Small Airports" ) {
                apex.item( "P122_SMALL_VISIBLE" ).setValue( ( this.data.layers[ l ].visible ? 'Y' : 'N' ) );
            } else if ( this.data.layers[ l ].name === "Large Airports" ) {
                apex.item( "P122_LARGE_VISIBLE" ).setValue( ( this.data.layers[ l ].visible ? 'Y' : 'N' ) );
            }
        }

    execution: 
      sequence: 10
      event: Refresh Selected Airports Classic Report # 804044299989118868
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Refresh =====================================
    id: 804044447671118870
    identification: 
      action: Refresh

    settings: 
      maintain-pagination: false

    affected-elements: 
      selection-type: Region
      region: Selected Airports # 804041962822118845

    execution: 
      sequence: 20
      event: Refresh Selected Airports Classic Report # 804044299989118868
      fire-when-event-result-is: True
      fire-on-initialization: false

- # ====== Dynamic Action: On Click Point ======================
  id: 806537383202529546
  identification: 
    name: On Click Point

  execution: 
    sequence: 30
    event-scope: Static
    type: Immediate

  when: 
    event: NATIVE_MAP_REGION|REGION TYPE|spatialmapobjectclick
    selection-type: Region
    region: US Airports # 1578990788728068984

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 806537763929529571
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        const { lng, lat } = this.data;
        
        apex.region("airport-map-region").call( "getMapObject" ).flyTo({ 
            center: [ lng, lat ],
            screenSpeed: 0.8
        });

    execution: 
      sequence: 10
      event: On Click Point # 806537383202529546
      fire-when-event-result-is: True
      fire-on-initialization: false

- # ====== Dynamic Action: Circle Finished =====================
  id: 1576328876931363104
  identification: 
    name: Circle Finished

  execution: 
    sequence: 10
    event-scope: Dynamic
    type: Immediate

  when: 
    event: NATIVE_MAP_REGION|REGION TYPE|spatialmapchanged
    selection-type: Region
    region: US Airports # 1578990788728068984

  client-side-condition: 
    type: JavaScript expression
    javascript-expression: this.data && this.data.changeType === "circle-drawn"

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 1575187570936459878
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        apex.region( "airport-map-region" ).call ( "clearCircle" );
        

    execution: 
      sequence: 40
      event: Circle Finished # 1576328876931363104
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Set Value ===================================
    id: 1576328967294363105
    identification: 
      action: Set Value

    settings: 
      set-type: JavaScript Expression
      javascript-expression: '( this.data.circle ? JSON.stringify( this.data.circle.data.geometry ) : "" )'
      suppress-change-event: false

    affected-elements: 
      selection-type: Item(s)
      item(s): 
      - P122_CIRCLE_GEOJSON

    execution: 
      sequence: 10
      event: Circle Finished # 1576328876931363104
      fire-when-event-result-is: True
      fire-on-initialization: true
      stop-execution-on-error: true
      wait-for-result: true

  - # ====== Action: Refresh =====================================
    id: 1576329222929363108
    identification: 
      action: Refresh

    settings: 
      maintain-pagination: false

    affected-elements: 
      selection-type: Region
      region: US Airports # 1578990788728068984

    execution: 
      sequence: 30
      event: Circle Finished # 1576328876931363104
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Refresh =====================================
