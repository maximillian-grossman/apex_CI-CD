      id: 1576372895071628097
      identification: 
        name: Small Airports
        layer-type: Points

      layout: 
        sequence: 30

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          select ID,
                 IATA_CODE,
                 CITY,
                 AIRPORT_NAME,
                 AIRPORT_TYPE,
                 STATE_NAME,
                 ELEVATION,
                 DIST_CITY_TO_AIRPORT,
                 LAND_AREA_COVERED,
                 ACTIVATION_DATE,
                 COMMERCIAL_OPS,
                 AIR_TAXI_OPS,
                 GEOMETRY,
                 1 as scale
            from EBA_SAMPLE_MAP_AIRPORTS
           where COMMERCIAL_OPS between 0 and 100000 and :P122_CIRCLE_GEOJSON is not null
             and sdo_anyinteract( geometry, mdsys.sdo_util.from_geojson( :P122_CIRCLE_GEOJSON)) = 'TRUE'
        page-items-to-submit: 
        - P122_CIRCLE_GEOJSON
        use-spatial-index: false

      column-mapping: 
        geometry-column-data-type: SDO_GEOMETRY
        geometry-column: GEOMETRY
        primary-key-column: ID

      point-objects: 
        style: SVG
        shape: Small Airport

      appearance: 
        fill-color: '#392423'
        fill-opacity: 0.8
        stroke-color: '#ffffff'

      point-clustering: 
        enable: false

      tooltip: 
        advanced-formatting: true
        html-expression: '&AIRPORT_NAME. (&IATA_CODE.)'

      info-window: 
        advanced-formatting: true
        html-expression: |
          <strong>&AIRPORT_NAME. (&IATA_CODE.)</strong><br>
          &CITY., &STATE_NAME.

      legend: 
        show: true
        enable-to-hide: true

    - # ====== Layer: Large Airports ===============================
      id: 1576373473231628097
      identification: 
        name: Large Airports
        layer-type: Points

      layout: 
        sequence: 10

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          select ID,
                 IATA_CODE,
                 CITY,
                 AIRPORT_NAME,
                 AIRPORT_TYPE,
                 STATE_NAME,
                 ELEVATION,
                 DIST_CITY_TO_AIRPORT,
                 LAND_AREA_COVERED,
                 to_char(ACTIVATION_DATE_DT,'fmDDfm-MON-YYYY') as ACTIVATION_DATE,
                 COMMERCIAL_OPS,
                 to_char(COMMERCIAL_OPS,'999G999G999G999') as com_ops_fmtd,
                 AIR_TAXI_OPS,
                 to_char(AIR_TAXI_OPS,'999G999G999G999') as air_ops_fmtd,
                 GEOMETRY,
                 2 as scale
            from EBA_SAMPLE_MAP_AIRPORTS
           where COMMERCIAL_OPS > 100000
        page-items-to-submit: 
        - P122_CIRCLE_GEOJSON
        use-spatial-index: false

      column-mapping: 
        geometry-column-data-type: SDO_GEOMETRY
        geometry-column: GEOMETRY
        primary-key-column: ID

      point-objects: 
        style: SVG
        shape: Airport
        shape-scale: 2

      appearance: 
        fill-color: '#ff0000'
        stroke-color: '#ffffff'

      point-clustering: 
        enable: false

      tooltip: 
        advanced-formatting: true
        html-expression: <strong>&AIRPORT_NAME. (&IATA_CODE.)</strong>

      info-window: 
        advanced-formatting: true
        html-expression: |
          <h3>&AIRPORT_NAME. (&IATA_CODE.)</h3>
          <p>
          &AIRPORT_TYPE.<br>
          <strong>&CITY., &STATE_NAME.</strong><br>
          {if ACTIVATION_DATE/}
          Activation Date: &ACTIVATION_DATE.<br>
          {endif/}
          {if COMMERCIAL_OPS/}
          Commercial Operations: &COM_OPS_FMTD.<br>
          {endif/}
          {if AIR_TAXI_OPS/}
          Taxi Operations: &AIR_OPS_FMTD.<br>
          {endif/}

      legend: 
        show: true
        enable-to-hide: true

