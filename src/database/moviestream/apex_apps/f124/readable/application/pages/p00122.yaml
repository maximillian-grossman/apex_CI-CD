    layers: 
    - # ====== Layer: Search Circle ================================
      id: 1575187481379459877
      identification: 
        name: Search Circle
        layer-type: Polygons

      layout: 
        sequence: 20

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          select 0 as id,
                 mdsys.sdo_util.from_geojson( to_clob( :P122_CIRCLE_GEOJSON )) as geometry
            from sys.dual
           where :P122_CIRCLE_GEOJSON is not null
        page-items-to-submit: 
        - P122_CIRCLE_GEOJSON
        use-spatial-index: false

