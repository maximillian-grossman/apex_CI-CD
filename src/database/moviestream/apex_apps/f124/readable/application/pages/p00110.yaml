- # ====== Region: US Airports =================================
  id: 1575317505232558825
  identification: 
    name: US Airports
    type: Map

  source: 
    location: None

  layout: 
    sequence: 30
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Blank with Attributes (No Grid)
    template-options: 
    - '#DEFAULT#'
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    static-id: airport-map-region
    region-display-selector: true
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    id: 1575317621389558826
    map: 
      background: Default
      height: 640

    controls: 
      navigation-bar: Zoom and Compass
      navigation-bar-position: End
      options: 
      - Scale Bar
      - Infinite Map
      - Rectangle Zoom

    initial-position-and-zoom: 
      type: Static Values
      longitude: '-90'
      latitude: 35
      zoom-level: 3

    legend: 
      show: true
      position: End

    attributes: 
      messages-position: Below
      unit-system: Metric

    performance: 
      lazy-loading: true

    layers: 
    - # ====== Layer: US State =====================================
      id: 1572118545519032295
      identification: 
        name: US State
        layer-type: Polygons

      layout: 
        sequence: 10

      source: 
        location: Local Database
        type: Table / View
        table-owner: Parsing Schema
        table-name: EBA_SAMPLE_MAP_STATES
        include-rowid-column: false
        where-clause: 'upper(NAME) = :P110_STATE'
        page-items-to-submit: 
        - P110_STATE
        use-spatial-index: false

      column-mapping: 
        geometry-column-data-type: SDO_GEOMETRY
        geometry-column: GEOMETRY

      appearance: 
        use-color-scheme: false
        fill-color: '#808080'
        fill-opacity: 0.3
        stroke-color: '#101010'

      tooltip: 
        advanced-formatting: false
        column: NAME

      info-window: 
        advanced-formatting: false

      legend: 
        show: true
        enable-to-hide: true

    - # ====== Layer: Airports Density =============================
      id: 1575317716584558827
      identification: 
        name: Airports Density
        layer-type: Heat Map

      layout: 
        sequence: 20

      source: 
        location: Local Database
        type: Table / View
        table-owner: Parsing Schema
        table-name: EBA_SAMPLE_MAP_AIRPORTS
        include-rowid-column: false
        where-clause: |
          STATE_NAME = :P110_STATE or :P110_STATE IS NULL
          and airport_type = 'HELIPORT' 
        page-items-to-submit: 
        - P110_STATE
        use-spatial-index: false

      column-mapping: 
        geometry-column-data-type: SDO_GEOMETRY
        geometry-column: GEOMETRY
        primary-key-column: ID

      appearance: 
        color-scheme: Sequential
        scheme-name: Sunset

      legend: 
        show: true
        enable-to-hide: true

