- # ====== Region: US States (Legacy Oracle Maps Plug-In) ======
  id: 1568719226110744786
  identification: 
    name: US States (Legacy Oracle Maps Plug-In)
    type: 'Legacy: Oracle HTML5 Maps - Region'

  source: 
    sql-query: |
      select id,
             name as infotip,
             geometry,
             'blue' as style,
             null as markersize
        from eba_sample_map_states
      union all
      select id,
             city || ' (' || iata_code || ')' as infotip,
             geometry,
             'red' as style,
             'C' || round(commercial_ops/10000) as markersize
        from eba_sample_map_airports
       where commercial_ops > 50000
      

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
