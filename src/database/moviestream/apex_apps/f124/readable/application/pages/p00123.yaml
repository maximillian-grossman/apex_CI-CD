- # ====== Region: About this Page =============================
  id: 1572119208822032302
  identification: 
    name: About this Page
    type: Static Content

  source: 
    html-code: |
      <p>This page illustrates how to combine a Map with a Interactive Report region. Whenever the map is panned or zoomed, the Interactive  Report refreshes to show the airports being currently visible on the map. The report can be used for keyboard navigation. Clicking the <span class="fa fa-map-marker"></span> button opens the information popup for the selected airport on the map.</p>
      <p>This feature is implemented using the <strong>Bounding Box Item</strong> Map region attribute. If enabled, the map will always set that item to the coordinates of the current map window in GeoJSON format. Then use Oracle Spatial SQL functions in the Interactive Report query to restrict the filter results accordingly. Note that this feature requires a Spatial index to be created on the table.</p>

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: REGION_POSITION_04
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Inline Popup
    template-options: 
    - '#DEFAULT#'
    - js-dialog-autoheight
    - js-popup-noOverlay
    - js-popup-callout
    - js-dialog-size480x320
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    static-id: about_this_page
    custom-attributes: 
    - data-parent-element="#help_button"
    region-display-selector: true
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    settings: 
      output-as: HTML
      expand-shortcuts: false

