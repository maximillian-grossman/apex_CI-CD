- # ====== Region: Map =========================================
  id: 1577716697447230503
  identification: 
    name: Map
    type: Map

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select ID,
             IATA_CODE,
             CITY,
             STATE_NAME,
             AIRPORT_NAME,
             AIRPORT_TYPE,
             ELEVATION,
             DIST_CITY_TO_AIRPORT,
             LAND_AREA_COVERED,
             to_char(ACTIVATION_DATE_DT,'fmDDfm-MON-YYYY') as ACTIVATION_DATE,
             COMMERCIAL_OPS,
             to_char(COMMERCIAL_OPS,'999G999G999G999') as com_ops_fmtd,
             AIR_TAXI_OPS,
             to_char(AIR_TAXI_OPS,'999G999G999G999') as air_ops_fmtd,
             GEOMETRY,
             case when commercial_ops > 100000 then 'Airport' else 'Flag Pennant' end as shape,
             case when commercial_ops > 100000 then 'red' else 'gray' end as color,
             case when commercial_ops > 100000 then 'fa-map-marker-s' else 'fa-flag-pennant' end as icon,
             case when commercial_ops > 100000 then 2 else 1 end as scale
        from EBA_SAMPLE_MAP_AIRPORTS
       where COMMERCIAL_OPS > 1000

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Blank with Attributes
    template-options: 
    - '#DEFAULT#'
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    static-id: airport-map-region
    region-display-selector: true
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    id: 1572216935910492545
    map: 
      background: Default
      height: 640

    controls: 
      navigation-bar: Zoom and Compass
      navigation-bar-position: End
      options: 
      - Scale Bar
      - Infinite Map
      - Rectangle Zoom

    initial-position-and-zoom: 
      type: Static Values
      longitude: '-110'
      latitude: 35
      zoom-level: 4

    legend: 
      show: true
      position: End

    attributes: 
      messages-position: Below
      unit-system: Metric

    performance: 
      lazy-loading: true

    advanced: 
      bounding-box-item: P123_BBOX

    layers: 
    - # ====== Layer: Small Airports ===============================
      id: 755462498489836466
      identification: 
        name: Small Airports
        layer-type: Points

      layout: 
        sequence: 10

      source: 
        location: Region Source
        use-spatial-index: false

      row-assignment: 
        column: SCALE
        value-for-this-layer: 1

      column-mapping: 
        geometry-column-data-type: SDO_GEOMETRY
        geometry-column: GEOMETRY
        primary-key-column: ID

      point-objects: 
        style: SVG
        shape: '&SHAPE.'
        shape-scale: '&SCALE.'

      appearance: 
        fill-color: '&COLOR.'
        fill-opacity: 0.8
        stroke-color: '#ffffff'

      point-clustering: 
        enable: false

      tooltip: 
        advanced-formatting: true
        html-expression: '&AIRPORT_NAME. (&IATA_CODE.)'

      info-window: 
        advanced-formatting: true
        html-expression: |
          <strong>&AIRPORT_NAME. (&IATA_CODE.)</strong><br>
          &CITY., &STATE_NAME.

      legend: 
        show: true
        enable-to-hide: true
        icon-css-classes: fa-flag-pennant

    - # ====== Layer: Large Airports ===============================
      id: 1572217481871492549
      identification: 
        name: Large Airports
        layer-type: Points

      layout: 
        sequence: 20

      source: 
        location: Region Source
        use-spatial-index: false

      row-assignment: 
        column: SCALE
        value-for-this-layer: 2

      column-mapping: 
        geometry-column-data-type: SDO_GEOMETRY
        geometry-column: GEOMETRY
        primary-key-column: ID

      point-objects: 
        style: SVG
        shape: '&SHAPE.'
        shape-scale: '&SCALE.'

      appearance: 
        fill-color: '&COLOR.'
        fill-opacity: 0.8
        stroke-color: '#ffffff'

      point-clustering: 
        enable: false

      tooltip: 
        advanced-formatting: true
        html-expression: <strong>&AIRPORT_NAME. (&IATA_CODE.)</strong>

      info-window: 
        advanced-formatting: true
        html-expression: |
          <h3>&AIRPORT_NAME. (&IATA_CODE.)</h3>
          <p>&AIRPORT_TYPE.<br>
          <strong>&CITY., &STATE_NAME.</strong><br>
          {if ACTIVATION_DATE/}
          Activation Date: &ACTIVATION_DATE.<br>
          {endif/}
          {if COMMERCIAL_OPS/}
          Commercial Operations: &COM_OPS_FMTD.<br>
          {endif/}
          {if AIR_TAXI_OPS/}
          Taxi Operations: &AIR_OPS_FMTD.<br>
          {endif/}

      legend: 
        show: true
        enable-to-hide: true
        icon-css-classes: fa-map-marker-s

