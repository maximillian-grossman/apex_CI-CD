- # ====== Dynamic Action: Refresh Report ======================
  id: 1572221129074492610
  identification: 
    name: Refresh Report

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: NATIVE_MAP_REGION|REGION TYPE|spatialmapchanged
    selection-type: Region
    region: Map # 1577716697447230503

  client-side-condition: 
    type: JavaScript expression
    javascript-expression: $v("P123_BBOX") !== "" && apex.region("airport-map-region").call("getMapCenterAndZoomLevel").zoom >= 3

  actions: 
  - # ====== Action: Refresh =====================================
    id: 755462388079836465
    identification: 
      action: Refresh

    settings: 
      maintain-pagination: false

    affected-elements: 
      selection-type: Region
      region: Results # 755460190472836443

    execution: 
      sequence: 20
      event: Refresh Report # 1572221129074492610
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Execute JavaScript Code =====================
    id: 800036718113676061
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        // the "map-changed" event sends the type of change as the "changeType" attribute. "toggle-layer" indicates
        // that the layer visibility has been toggled by clicking the layer entry in the legend.
        if ( this.data.changeType === "toggle-layer") {
            //
            // "copy" the layer visibility information from the dynamic action "payload" object to the
            // P123_LARGE_VISIBLE and P123_SMALL_VISIBLE page items, which are then picked up by the
            // report query.
            for ( l = 0; l < this.data.layers.length; l++) {
                if ( this.data.layers[ l ].name === "Small Airports" ) {
                    apex.item( "P123_SMALL_VISIBLE" ).setValue( ( this.data.layers[ l ].visible ? 'Y' : 'N' ) );
                } else if ( this.data.layers[ l ].name === "Large Airports" ) {
                    apex.item( "P123_LARGE_VISIBLE" ).setValue( ( this.data.layers[ l ].visible ? 'Y' : 'N' ) );
                }
            }
        }

    execution: 
      sequence: 10
      event: Refresh Report # 1572221129074492610
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Show ========================================
    id: 1572118700244032297
    identification: 
      action: Show

    affected-elements: 
      selection-type: Region
      region: Results # 755460190472836443

    execution: 
      sequence: 30
      event: Refresh Report # 1572221129074492610
      fire-when-event-result-is: True
      fire-on-initialization: true

  - # ====== Action: Hide ========================================
    id: 1572118889868032298
    identification: 
      action: Hide

    affected-elements: 
      selection-type: Region
      region: Results # 755460190472836443

    execution: 
      sequence: 20
      event: Refresh Report # 1572221129074492610
      fire-when-event-result-is: False
      fire-on-initialization: true

  - # ====== Action: Hide ========================================
    id: 1572119050549032300
    identification: 
      action: Hide

    affected-elements: 
      selection-type: Region
      region: No Report # 1572118904062032299

    execution: 
      sequence: 40
      event: Refresh Report # 1572221129074492610
      fire-when-event-result-is: True
      fire-on-initialization: true

  - # ====== Action: Show ========================================
    id: 1572119111096032301
    identification: 
      action: Show

    affected-elements: 
