    layers: 
    - # ====== Layer: Small Airports ===============================
      id: 1572117858853032288
      identification: 
        name: Small Airports
        layer-type: Points

      layout: 
        sequence: 10

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          select ID,
                 IATA_CODE,
                 initcap(AIRPORT_NAME) airport_name,
                 AIRPORT_TYPE,
                 case airport_type
                     when 'HELIPORT' then 'Heliport'
                     else                 'Small Airport' end as marker_type,
                 case airport_type
                     when 'HELIPORT' then '#1e77b5'
                     else                 '#392423' end as marker_color,
                 CITY,
                 STATE_NAME,
                 ELEVATION,
                 DIST_CITY_TO_AIRPORT,
                 LAND_AREA_COVERED,
                 to_char(ACTIVATION_DATE_DT,'fmDDfm-MON-YYYY') as ACTIVATION_DATE,
                 COMMERCIAL_OPS,
                 to_char(COMMERCIAL_OPS,'999G999G999G999') as com_ops_fmtd,
                 AIR_TAXI_OPS,
                 to_char(AIR_TAXI_OPS,'999G999G999G999') as air_ops_fmtd,
                 GEOMETRY
            from EBA_SAMPLE_MAP_AIRPORTS
           where COMMERCIAL_OPS between 0 and 100000
          
        use-spatial-index: false

      column-mapping: 
        geometry-column-data-type: SDO_GEOMETRY
        geometry-column: GEOMETRY
        primary-key-column: ID

      point-objects: 
        style: SVG
        shape: '&MARKER_TYPE.'

      appearance: 
        fill-color: '&MARKER_COLOR.'
        fill-opacity: 0.8

      point-clustering: 
        enable: false

      tooltip: 
        advanced-formatting: true
        html-expression: '&AIRPORT_NAME. (&IATA_CODE.)'

      info-window: 
        advanced-formatting: true
        html-expression: |
          <strong>&AIRPORT_NAME. (&IATA_CODE.)</strong><br>
          &CITY., &STATE_NAME.

      legend: 
        show: true
        enable-to-hide: true

    - # ====== Layer: Large Airports ===============================
      id: 1572117933127032289
      identification: 
        name: Large Airports
        layer-type: Points

      layout: 
        sequence: 20

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          select ID,
                 IATA_CODE,
                 CITY,
                 initcap(AIRPORT_NAME) airport_name,
                 AIRPORT_TYPE,
                 STATE_NAME,
                 ELEVATION,
                 DIST_CITY_TO_AIRPORT,
                 LAND_AREA_COVERED,
                 to_char(ACTIVATION_DATE_DT,'fmDDfm-MON-YYYY') as ACTIVATION_DATE,
                 COMMERCIAL_OPS,
                 to_char(COMMERCIAL_OPS,'999G999G999G999') as com_ops_fmtd,
                 AIR_TAXI_OPS,
                 to_char(AIR_TAXI_OPS,'999G999G999G999') as air_ops_fmtd,
                 GEOMETRY
            from EBA_SAMPLE_MAP_AIRPORTS
           where COMMERCIAL_OPS > 100000
             and airport_type = 'AIRPORT'
        use-spatial-index: false

      column-mapping: 
        geometry-column-data-type: SDO_GEOMETRY
        geometry-column: GEOMETRY
        primary-key-column: ID

      point-objects: 
        style: SVG
        shape: Airport
        shape-scale: 2

      appearance: 
        fill-color: '#ea3324'
        stroke-color: '#ffffff'
        stroke-width: 2

      point-clustering: 
        enable: false

      tooltip: 
        advanced-formatting: false
        column: IATA_CODE

      info-window: 
        advanced-formatting: true
        html-expression: |
          <h3>&CITY. (&IATA_CODE.)</h3>
          <p>
          <strong>&STATE_NAME.</strong><br>
          {if ACTIVATION_DATE/}
          Activation Date: &ACTIVATION_DATE.<br>
          {endif/}
          {if COMMERCIAL_OPS/}
          Commercial Operations: &COM_OPS_FMTD.<br>
          {endif/}
          {if AIR_TAXI_OPS/}
          Taxi Operations: &AIR_OPS_FMTD.<br>
          {endif/}

      legend: 
        show: true
        enable-to-hide: true

- # ====== Region: About This Page =============================
  id: 1575187390725459876
  identification: 
    name: About This Page
    type: Static Content

  source: 
    html-code: |
      <p>
      This map visualizes US airports (with the "COMMERCIAL_OPS" column being NOT NULL) as 
       a <em>Point Layer</em>. Each airport is visualized with a <em>Map Marker</em>. Clicking the map marker reveals come detail information about the airport. One map region shows usage of <em>Default Map Markers</em>, which are provided by APEX, the other one illustrates how to use <em>Custom Map Markers</em>, which are configured in <strong>Map Region</strong>, <strong>Attributes</strong>, <strong>Custom SVG Styles</strong>.</p>
      

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: REGION_POSITION_04
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Inline Popup
    template-options: 
    - '#DEFAULT#'
    - js-dialog-autoheight
    - js-popup-noOverlay
    - js-popup-callout
    - js-dialog-size480x320
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    static-id: about_this_page
    custom-attributes: 
    - data-parent-element="#help_button"
    region-display-selector: true
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    settings: 
      output-as: HTML
      expand-shortcuts: false

dynamic-actions: 
- # ====== Dynamic Action: On Click Point ======================
  id: 806542167223709963
  identification: 
    name: On Click Point

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: NATIVE_MAP_REGION|REGION TYPE|spatialmapobjectclick
    selection-type: Region
    region: Custom Map Markers # 1572117652805032286

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 806542530926709963
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        const { lng, lat } = this.data;
        
        apex.region("custom-map-region").call( "getMapObject" ).flyTo({ 
            center: [ lng, lat ],
            screenSpeed: 0.8
        });

    execution: 
      sequence: 10
      event: On Click Point # 806542167223709963
      fire-when-event-result-is: True
      fire-on-initialization: false

