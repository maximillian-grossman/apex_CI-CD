- # ====== Region: Map App Pages ===============================
  id: 806429222410001627
  identification: 
    name: Map App Pages
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select
          list_entry_id as id,
          display_sequence,
          entry_text as title,
          CURRENT_FOR_PAGES_EXPRESSION as card_link_page_id,
          'fa ' || entry_image as card_icon,
          entry_attribute_01 as description,
          entry_attribute_02 as screenshot_img_path
      from
          apex_application_list_entries
      where
          application_id = :APP_ID
      and
          list_name = 'All Maps'
      order by
          display_sequence asc

  order-by: 
    type: None

  layout: 
    sequence: 40
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Cards Container
    template-options: 
    - '#DEFAULT#'
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: true
    exclude-title-from-translation: false

  server-side-condition: 
    type: Rows returned
    sql-query: select 1 from eba_sample_map_states

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    id: 806429348652001628
    appearance: 
      layout: Grid
      grid-columns: 4 Columns

    card: 
      primary-key-column-1: ID

    title: 
      advanced-formatting: false
      column: TITLE

    subtitle: 
      advanced-formatting: true
      html-expression: <h4 class="a-CardView-subTitle">&DESCRIPTION!RAW.</h4>

    body: 
      advanced-formatting: false

    secondary-body: 
      advanced-formatting: false

    icon-and-badge: 
      icon-source: No Icon

    media: 
      advanced-formatting: false
      source: Image URL
      url: '#APP_IMAGES#&SCREENSHOT_IMG_PATH.'
      position: First
      appearance: Widescreen
      sizing: Fit
      image-description: '&TITLE.'

    performance: 
      lazy-loading: true

    pagination: 
      type: Page
      show-total-count: false
      cards-per-page: 15

    actions: 
    - # ====== Action: Full Card ===================================
      id: 806429435291001629
      identification: 
        type: Full Card

      layout: 
        sequence: 10

      link: 
        type: Redirect to Page in this Application
        target: 
          url: 'f?p=&APP_ID.:&CARD_LINK_PAGE_ID.:&SESSION.::&DEBUG.:::'
          page: '&CARD_LINK_PAGE_ID.'

