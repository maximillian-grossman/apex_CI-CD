    - # ====== Layer: Distance Circle ==============================
      id: 1575186219463459864
      identification: 
        name: Distance Circle
        layer-type: Polygons

      layout: 
        sequence: 20

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          select 0 as id,
                 mdsys.sdo_util.circle_polygon(
                  point         => mdsys.sdo_util.from_geojson( :P124_CLICK_POSITION ),
                  radius        => :P124_MAX_DISTANCE * 1000,
                  arc_tolerance => 1 ) as geometry
            from sys.dual
           where :P124_MAX_DISTANCE is not null and :P124_CLICK_POSITION is not null  
        use-spatial-index: false

      column-mapping: 
        geometry-column-data-type: SDO_GEOMETRY
        geometry-column: GEOMETRY
        primary-key-column: ID

      appearance: 
        use-color-scheme: false
        fill-color: '#d8aa12'
        fill-opacity: 0.2
        stroke-color: '#101010'

      tooltip: 
        advanced-formatting: false

      info-window: 
        advanced-formatting: false

      legend: 
        show: true
        enable-to-hide: true

    - # ====== Layer: Neighbors ====================================
      id: 1939410411169880301
      identification: 
        name: Neighbors
        layer-type: Points

      layout: 
        sequence: 40

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          select id,
                 IATA_CODE,
                 CITY,
                 STATE_NAME,
                 AIRPORT_NAME,
                 AIRPORT_TYPE,
                 ELEVATION,
                 DIST_CITY_TO_AIRPORT,
                 LAND_AREA_COVERED,
                 ACTIVATION_DATE,
                 COMMERCIAL_OPS,
                 AIR_TAXI_OPS,
                 GEOMETRY,
                 case 
                     when sdo_nn_distance(1) < 50                 then '#e06060'
                     when sdo_nn_distance(1) between 50  and 100  then '#c05050'
                     when sdo_nn_distance(1) between 100 and 200  then '#a04040'
                     when sdo_nn_distance(1) between 200 and 500  then '#803030'
                     when sdo_nn_distance(1) between 500 and 1000 then '#601010'
                     else                                              '#200000'
                 end as color
            from EBA_SAMPLE_MAP_AIRPORTS
           where sdo_nn( geometry, mdsys.sdo_util.from_geojson (:P124_CLICK_POSITION ), case when :P124_MAX_DISTANCE is not null then 'distance=' || :P124_MAX_DISTANCE || ' ' end || 'unit=km', 1 ) = 'TRUE'
             and airport_type = :P124_AIRPORT_TYPE
             and nvl(commercial_ops,0) >= nvl( :P124_COMMERCIAL_OPS_MIN, 0)
             and :P124_CLICK_POSITION is not null and :P124_AIRPORT_TYPE is not null 
             and rownum <=   :P124_NEIGHBOR_COUNT
        page-items-to-submit: 
        - P124_COMMERCIAL_OPS_MIN
        - P124_NEIGHBOR_COUNT
        - P124_CLICK_POSITION
        - P124_AIRPORT_TYPE
        - P124_MAX_DISTANCE
        use-spatial-index: false

      column-mapping: 
        geometry-column-data-type: SDO_GEOMETRY
        geometry-column: GEOMETRY
        primary-key-column: ID

      point-objects: 
        style: SVG
        shape: Circle
        shape-scale: 1.5

      appearance: 
        fill-color: '&COLOR.'
        stroke-color: '#ffffff'
        stroke-width: 2

      point-clustering: 
        enable: false

      tooltip: 
        advanced-formatting: true
        html-expression: '&AIRPORT_NAME. (&IATA_CODE.)'

      info-window: 
        advanced-formatting: true
        html-expression: |
          <h3>&AIRPORT_NAME. (&IATA_CODE.)</h3>
          <p>&AIRPORT_TYPE.<br>
          <strong>&CITY., &STATE_NAME.</strong><br>
          {if ACTIVATION_DATE/}
          Activation Date: &ACTIVATION_DATE.<br>
          {endif/}
          {if COMMERCIAL_OPS/}
          Commercial Operations: &COMMERCIAL_OPS.<br>
          {endif/}
          {if AIR_TAXI_OPS/}
          Taxi Operations: &AIR_TAXI_OPS.<br>
          {endif/}

      legend: 
        show: true
        enable-to-hide: true

    - # ====== Layer: Clicked Position =============================
      id: 1939410721128880304
      identification: 
        name: Clicked Position
        layer-type: Points

      label: 
        label: my Position

      layout: 
        sequence: 50

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          select 0 as id, mdsys.sdo_util.from_geojson( :P124_CLICK_POSITION ) as geometry 
            from sys.dual
           where :P124_CLICK_POSITION is not null
        use-spatial-index: false

      column-mapping: 
        geometry-column-data-type: SDO_GEOMETRY
        geometry-column: GEOMETRY
        primary-key-column: ID

      point-objects: 
        style: SVG
        shape: Pin Circle
        shape-scale: 2

      appearance: 
        fill-color: '#007aff'
        stroke-color: '#ffffff'
        stroke-width: 1

      point-clustering: 
        enable: false

      tooltip: 
        advanced-formatting: true
        html-expression: This is the position you have clicked on the map.

      info-window: 
        advanced-formatting: true
        html-expression: Your Position

      legend: 
        show: true
        enable-to-hide: true

