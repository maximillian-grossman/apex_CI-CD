dynamic-actions: 
- # ====== Dynamic Action: Refresh Airports IRR if neighbors leg
  id: 806428877805001623
  identification: 
    name: Refresh Airports IRR if neighbors legend is toggled

  execution: 
    sequence: 50
    event-scope: Static
    type: Immediate

  when: 
    event: NATIVE_MAP_REGION|REGION TYPE|spatialmapchanged
    selection-type: Region
    region: Map # 2350517981790828860

  client-side-condition: 
    type: JavaScript expression
    javascript-expression: this.data && this.data.changeType === "toggle-layer"

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 806429013402001624
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        // the "map-changed" event sends the type of change as the "changeType" attribute. "toggle-layer" indicates
        // that the layer visibility has been toggled by clicking the layer entry in the legend.
        // "copy" the layer visibility information from the dynamic action "payload" object to the
        // P124_NEIGHBORS page item, which are then picked up by the
        // report query.
        for ( l = 0; l < this.data.layers.length; l++) {
            if ( this.data.layers[ l ].name === "Neighbors" ) {
                apex.item( "P124_NEIGHBORS" ).setValue( ( this.data.layers[ l ].visible ? 'Y' : 'N' ) );
            }
        }

    execution: 
      sequence: 10
      event: Refresh Airports IRR if neighbors legend is toggled # 806428877805001623
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Refresh =====================================
    id: 806429114381001625
    identification: 
      action: Refresh

    settings: 
      maintain-pagination: false

    affected-elements: 
      selection-type: Region
      region: Airports # 2350516393313828844

    execution: 
      sequence: 30
      event: Refresh Airports IRR if neighbors legend is toggled # 806428877805001623
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Execute Server-side Code ====================
    id: 806429208253001626
    identification: 
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |
        -- This true action just ensures the hidden P124_NEIGHBORS value gets into session state
        -- before refreshing the Airports IRR
        null;
      items-to-submit: 
      - P124_NEIGHBORS

    execution: 
      sequence: 20
      event: Refresh Airports IRR if neighbors legend is toggled # 806428877805001623
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

