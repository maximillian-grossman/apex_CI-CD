- # ====== Region: Texas House Bills ===========================
  id: 29273219289460800
  identification: 
    name: Texas House Bills
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select a.*, b.first_page_image
      from (
      select 
          l.id
          , l.file_name
          , 'File Size: '||l.file_size file_size
          , 'Num Text Items: '||count(v.chunk_id) num_chunks
      from legislation l, legislation_vector v
      where l.id = v.id
      group by     l.id
          , l.file_name
          , 'File Size: '||l.file_size) a,
      legislation b
      where a.id = b.id

  order-by: 
    type: None

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

