- # ====== Region: Master Records ==============================
  id: 27270385979481099
  identification: 
    name: Master Records
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select "ID",
          null LINK_CLASS,
          apex_page.get_url(p_items => 'P21_ID', p_values => "ID") LINK,
          null ICON_CLASS,
          null LINK_ATTR,
          null ICON_COLOR_CLASS,
          case when coalesce(:P21_ID,'0') = "ID"
            then 'is-active' 
            else ' '
          end LIST_CLASS,
          (substr("USERNAME", 1, 50)||( case when length("USERNAME") > 50 then '...' else '' end )) LIST_TITLE,
          (substr("STARTED_ON", 1, 50)||( case when length("STARTED_ON") > 50 then '...' else '' end )) LIST_TEXT,
          null LIST_BADGE
      from "CONVERSATIONS" x
      where (:P21_SEARCH is null
              or upper(x."USERNAME") like '%'||upper(:P21_SEARCH)||'%'
              or upper(x."STARTED_ON") like '%'||upper(:P21_SEARCH)||'%'
          )
      order by "USERNAME"
    page-items-to-submit: 
    - P21_SEARCH

  order-by: 
    type: None

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: REGION_POSITION_02
