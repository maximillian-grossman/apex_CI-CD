dynamic-actions: 
- # ====== Dynamic Action: PDFViewer ===========================
  id: 29335221335920396
  identification: 
    name: PDFViewer

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Custom
    custom-event: PDFViewer
    selection-type: JavaScript Expression
    javascript-expression: document

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 29335322425920397
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        let id = this.data.id;async function getData(){
        let afetch = await fetch('https://ijegqeyui1cwvrq-dgcadw2.adb.us-ashburn-1.oraclecloudapps.com/ords/vector/demopdfviewer/examplepdf/' +id );
        let blob = await afetch.blob();
        let blobUrl = URL.createObjectURL(blob);
        let pdfContainer = document.getElementById('pdfViewer');
        
        pdfContainer.getElementsByTagName('iframe')[0].src = blobUrl;}
        
        getData();

    execution: 
      sequence: 10
      event: PDFViewer # 29335221335920396
      fire-when-event-result-is: True
      fire-on-initialization: false

