- # ====== Region: Search Results ==============================
  id: 29342337398990415
  identification: 
    name: Search Results
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select a.*, b.first_page_image
      from (
      select 
          l.id
          , l.file_name
          , 'File Size: '||l.file_size file_size
          , 'Num Text Items: '||count(v.chunk_id) num_chunks
      from legislation l, legislation_vector v
      where l.id = v.id
      group by     l.id
          , l.file_name
          , 'File Size: '||l.file_size) a,
      legislation b
      where a.id = b.id

  order-by: 
    type: None

