dynamic-actions: 
- # ====== Dynamic Action: create_conversation =================
  id: 29276830981708272
  identification: 
    name: create_conversation

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: create_new_conversation # 29276749401708271

  actions: 
  - # ====== Action: Execute Server-side Code ====================
    id: 29276901065708273
    identification: 
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: 'chathistory_pkg.prc_add_conversation(:APP_USER, SYSTIMESTAMP, :APP_SESSION);'

    execution: 
      sequence: 10
      event: create_conversation # 29276830981708272
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

  - # ====== Action: Clear state =================================
    id: 29277361112708277
    identification: 
      name: Clear state
      action: Clear

    affected-elements: 
      selection-type: Item(s)
      item(s): 
      - P12_PROMPT
      - P12_RESPONSE

    execution: 
      sequence: 20
      event: create_conversation # 29276830981708272
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Submit Page =================================
    id: 29277581010708279
    identification: 
      action: Submit Page

    settings: 
      show-processing: true

    execution: 
      sequence: 30
      event: create_conversation # 29276830981708272
      fire-when-event-result-is: True
      fire-on-initialization: false

