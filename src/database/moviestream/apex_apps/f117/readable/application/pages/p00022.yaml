computations: 
- # ====== Computation: P22_NEED_BY ============================
  id: 1280372741573506441
  identification: 
    item-name: P22_NEED_BY

  execution: 
    sequence: 10
    point: Before Header

  computation: 
    type: Expression
    language: SQL
    sql-expression: to_char((sysdate + 14) + case to_char(sysdate + 14, 'fmDay','NLS_DATE_LANGUAGE = AMERICAN') when 'Saturday' then 2 when 'Sunday' then 1 else 0 end,'YYYYMMDDHH24MI') min_date

- # ====== Computation: P22_MINIMUM_DATE =======================
  id: 1280372918681506443
  identification: 
    item-name: P22_MINIMUM_DATE

  execution: 
    sequence: 10
    point: Before Header

  computation: 
    type: Expression
    language: SQL
    sql-expression: to_char((sysdate + 7) + case to_char(sysdate + 7, 'fmDay','NLS_DATE_LANGUAGE = AMERICAN') when 'Saturday' then 2 when 'Sunday' then 1 else 0 end,'YYYYMMDDHH24MI') min_date

