computations: 
- # ====== Computation: P15_CAN_UPDATE_PARAMS ==================
  id: 33914990020096709
  identification: 
    item-name: P15_CAN_UPDATE_PARAMS

  execution: 
    sequence: 10
    point: Before Header

  computation: 
    type: Expression
    language: PL/SQL
    pl/sql-expression: |
      case 
          when apex_human_task.is_allowed (
                  p_task_id   => :P15_TASK_ID,
                  p_operation => apex_human_task.c_task_op_set_params )
          then 'Y'
          else 'N'
      end

