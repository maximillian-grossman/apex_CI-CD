- # ====== Region: Tasks to Approve ============================
  id: 35325272459579981
  identification: 
    name: Tasks to Approve
    type: Content Row

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select task_id,
             task_type,
             task_def_name,
             details_app_name,
             details_link_target,
             subject,
             initiator,
             actual_owner,
             priority,
             due_on,
             due_in,
             due_in_hours,
             due_code,
             state_code,
             is_completed,
             outcome,
             created_on,
             created_ago,
             created_ago_hours,
             last_updated_on,
             badge_text,
             badge_state
        from table ( apex_human_task.get_tasks (
                         p_context            => 'MY_TASKS',
                         p_show_expired_tasks => :P3_SHOW_EXPIRED,
                         -- Omit following param to show tasks for all apps
                         p_application_id => :APP_ID
                         ) )
    page-items-to-submit: 
    - P3_SHOW_EXPIRED
    optimizer-hint: APEX$USE_NO_GROUPING_SETS

  order-by: 
    type: Item
    item: 
      item-name: P3_SORT_BY
      order-bys: 
      - key: CREATED_ON
        clause: created_on desc

      - key: DUE_ON
        clause: priority asc, due_on asc nulls last

  layout: 
    sequence: 30
    parent-region: No Parent
