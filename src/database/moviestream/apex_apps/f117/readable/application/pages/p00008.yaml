        <strong>Job:</strong> &JOB.<br />
        <strong>Salary:</strong> $&SAL.

    secondary-body: 
      advanced-formatting: false

    icon-and-badge: 
      icon-source: Initials
      icon-column: ENAME
      icon-position: End

    media: 
      advanced-formatting: false
      source: No Media

    performance: 
      lazy-loading: false

    pagination: 
      type: Scroll
      show-total-count: false

    messages: 
      when-no-data-found: No employees to display
      no-data-found-icon: fa-user

    actions: 
    - # ====== Action: Bank ========================================
      id: 351136661475416068
      identification: 
        type: Button
        label: Bank

      layout: 
        position: Primary
        sequence: 30

      link: 
        type: Redirect to Page in this Application
        target: 
          url: 'f?p=&APP_ID.:28:&SESSION.::&DEBUG.::P28_EMPNO:&EMPNO.'
          page: 28 # Request Bank Account Change
          values: 
            p28_empno: '&EMPNO.'

      appearance: 
        display-type: Text with Icon
        icon: fa-building
        hot: false
        css-classes: 
        - t-Button--small

      server-side-condition: 
        type: Item = Value
        item: PENDING_BANK_APPROVAL
        value: N
        execute-condition: For Each Row

    - # ====== Action: Salary ======================================
      id: 982111067843923266
      identification: 
        type: Button
        label: Salary

      layout: 
        position: Primary
        sequence: 10

      link: 
        type: Redirect to Page in this Application
        target: 
          url: 'f?p=&APP_ID.:4:&SESSION.::&DEBUG.::P4_EMPNO:&EMPNO.'
          page: 4 # Request Salary Change
          values: 
            p4_empno: '&EMPNO.'

      appearance: 
        display-type: Text with Icon
        icon: fa-edit
        hot: false
        css-classes: 
        - t-Button--small

      server-side-condition: 
        type: Item = Value
        item: PENDING_SAL_APPROVAL
        value: N
        execute-condition: For Each Row

    - # ====== Action: Job =========================================
      id: 982111602018923288
