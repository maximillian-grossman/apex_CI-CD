  behavior: 
    action: Defined by Dynamic Action
    execute-validations: true

dynamic-actions: 
- # ====== Dynamic Action: When Test Button Clicked ============
  id: 1291175534306616035
  identification: 
    name: When Test Button Clicked

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: Test # 1291168189914616001

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 1200054010490267060
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        apex.message.clearErrors();
        let approver_missing = $v('P10_TEST_RESULT_APPROVER') === '';
        let admin_missing = $v('P10_TEST_RESULT_ADMIN') === '';
        let problems = [];
        if (approver_missing) {
            problems.push(
                {
                    "type" : "error",
                    "location" : "page",
                    "message": 'No salary change approver was available to assign (after excluding your username). Check Approver participant entries.'
                }
            ); 
        }
        if (admin_missing) {
            problems.push(
                {
                    "type" : "error",
                    "location" : "page",
                    "message": 'No salary change admin was available to assign. Check Admin participant entries.'
                }
            );
        }
        if (problems.length > 0) {
            apex.message.showErrors(problems);
        }
        

    execution: 
      sequence: 20
      event: When Test Button Clicked # 1291175534306616035
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Execute Server-side Code ====================
    id: 1291176044297616038
    identification: 
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |
        eba_demo_appr.validate_admin_and_approver('SALARY_CHANGE',
                                                  :P10_EMPNO,
                                                  :P10_PROPOSED_SALARY,
                                                  :P10_TEST_RESULT_ADMIN,
                                                  :P10_TEST_RESULT_APPROVER);
        
      items-to-submit: 
      - P10_EMPNO
      - P10_PROPOSED_SALARY
      items-to-return: 
      - P10_TEST_RESULT_APPROVER
      - P10_TEST_RESULT_ADMIN
      suppress-change-event: false

    execution: 
      sequence: 10
      event: When Test Button Clicked # 1291175534306616035
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

