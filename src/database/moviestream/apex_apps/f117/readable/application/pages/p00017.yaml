- # ====== Region: Subject =====================================
  id: 1246768072497027938
  identification: 
    name: Subject
    type: Dynamic Content

  source: 
    language: PL/SQL
    pl/sql-function-body-returning-a-clob: |
      declare
          l_result clob;
      begin
          select to_clob(replace(replace(replace('
                  <div class="a-CardView has-title has-badge">
                    <div class="a-CardView-header">
                      <div class="a-CardView-headerBody">
                        <h3 class="a-CardView-title">#SUBJECT#</h3>
                      </div>
                      <div class="a-CardView-badge #BADGE_CSS_CLASSES#" title="#BADGE_TEXT#">
                        <span class="a-CardView-badgeValue">#BADGE_TEXT#</span>
                      </div>
                    </div>
                  </div>',
                 '#SUBJECT#'          , subject          ),
                 '#BADGE_TEXT#'       , badge_text       ),
                 '#BADGE_CSS_CLASSES#', badge_css_classes) )
            into l_result
            from table ( apex_approval.get_tasks (
                             p_context => 'SINGLE_TASK',
                             p_task_id => :P17_TASK_ID ) );
      
          return l_result;
      exception
          when no_data_found then
              return l_result;
      end;
    page-items-to-submit: 
    - P17_TASK_ID

  layout: 
    sequence: 60
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Standard
    template-options: 
