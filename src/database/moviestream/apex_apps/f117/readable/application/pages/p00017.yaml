computations: 
- # ====== Computation: P17_ID =================================
  id: 1242600249112420580
  identification: 
    item-name: P17_ID

  execution: 
    sequence: 20
    point: Before Header

  computation: 
    type: SQL Query (return single value)
    sql-query: |
      select detail_pk
      from apex_tasks
      where task_id = :P17_TASK_ID

  server-side-condition: 
    type: Item is NULL
    item: P17_ID

- # ====== Computation: P17_APPRAISAL_ID_PROVIDED ==============
  id: 1528612221197769885
  identification: 
    item-name: P17_APPRAISAL_ID_PROVIDED

  execution: 
    sequence: 10
    point: Before Header

  computation: 
    type: Expression
    language: PL/SQL
    pl/sql-expression: "CASE WHEN :P17_ID IS NOT NULL THEN 'Y' ELSE 'N' END"

- # ====== Computation: P17_ENAME ==============================
  id: 1535260013678633045
  identification: 
    item-name: P17_ENAME

  execution: 
    sequence: 10
    point: After Header

  computation: 
    type: SQL Query (return single value)
    sql-query: |
      select ename
      from eba_demo_appr_emp
      where empno = :P17_EMPNO

  server-side-condition: 
    type: Expression
    language: PL/SQL
    pl/sql-expression: ":P17_APPRAISAL_ID_PROVIDED = 'Y' or :P17_EMPNO != :CURRENT_USER_EMPNO"

- # ====== Computation: P17_EXPECTING_INPUT_FROM ===============
  id: 1545481809658617173
  identification: 
    item-name: P17_EXPECTING_INPUT_FROM

  execution: 
    sequence: 30
    point: Before Header

  computation: 
    type: SQL Query (return single value)
    sql-query: |
      select actual_owner
      from apex_tasks
      where task_id = :P17_TASK_ID

