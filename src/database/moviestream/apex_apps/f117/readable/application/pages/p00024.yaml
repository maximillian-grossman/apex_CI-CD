- # ====== Region: Demo Purposes Only Login ====================
  id: 1482591778918331872
  identification: 
    name: Demo Purposes Only Login
    type: Tree

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select case when connect_by_isleaf = 1 then 0
                  when level = 1             then 1
                  else                           -1
             end          as status, 
             level, 
             e.ename      as title, 
             'fa '||case when d.deptno = 40 
                         then 'fa-user-headset' 
                         else 'fa-user'
                    end   as icon, 
             e.empno      as value, 
             null         as tooltip, 
             null         as link 
      from eba_demo_appr_emp e
      left outer join eba_demo_appr_dept d
                   on d.deptno = e.deptno 
      start with mgr is null
      connect by prior empno = mgr
      order siblings by ename

  layout: 
    sequence: 30
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: 4

  appearance: 
    template: Blank with Attributes
    template-options: 
    - '#DEFAULT#'
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    static-id: userTree
    region-display-selector: false
    exclude-title-from-translation: false

  server-cache: 
    caching: Disabled

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    settings: 
      node-label-column: TITLE
      node-value-column: VALUE
      hierarchy: Not Computed
      node-status-column: STATUS
      hierarchy-level-column: LEVEL
      tooltip: None
      activate-node-link-with: Single Click
      link-column: LINK
      icon-css-class-column: ICON
      default-icon-css-class: icon-tree-folder
      icon-type-css-class: a-Icon
