    affected-elements: 
      selection-type: Item(s)
      item(s): 
      - P24_SELECTED_USERNAME

    execution: 
      sequence: 10
      event: When Node Changed # 1482591798881331873
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

  - # ====== Action: Hide Login Button for Current User ==========
    id: 1482592118154331876
    identification: 
      name: Hide Login Button for Current User
      action: Hide

    affected-elements: 
      selection-type: Button
      button: LOGIN # 1482592269831331877

    execution: 
      sequence: 30
      event: When Node Changed # 1482591798881331873
      fire-when-event-result-is: True
      fire-on-initialization: true

    client-side-condition: 
      type: Item = Value
      item: P24_SELECTED_USERNAME
      value: '&APP_USER.'

  - # ====== Action: Show Login Button for Other User ============
