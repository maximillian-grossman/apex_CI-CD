- # ====== Region: My Workflows - Report =======================
  id: 40530816623512643
  identification: 
    name: My Workflows - Report
    type: Content Row

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select workflow_id,
             workflow_def_name,
             workflow_def_app_name,
             title,
             initiator,
             state_code,
             created_on,
             created_ago,
             created_ago_hours,
             last_updated_on,
             badge_text,
             badge_state,
             apex_page.get_url(
               p_page => 31,
               p_items => 'P31_WORKFLOW_ID',
               p_values => WORKFLOW_ID) as map_url
        from table ( apex_workflow.get_workflows (
                         p_context => 'MY_WORKFLOWS'
                         --, p_application_id => :APP_ID
                         ) )
    optimizer-hint: APEX$USE_NO_GROUPING_SETS

  order-by: 
    type: Item
    item: 
      item-name: P19_SORT_BY
      order-bys: 
      - key: CREATED_ON
        clause: created_on desc

      - key: LAST_UPDATED_ON
        clause: last_updated_on desc

  layout: 
    sequence: 30
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Cards Container
    template-options: 
    - '#DEFAULT#'
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Region

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    appearance: 
      display: Multiple (Report)

    settings: 
      title: '&TITLE.'
      description: |
        <strong>&WORKFLOW_DEF_NAME!HTML.</strong>
        {if INITIATOR/}
            <span role="separator" aria-label="&middot;"> &middot; </span>
            &{APEX.WORKFLOW.INITIATED_BY_USER_SINCE 0=&INITIATOR!HTML. 1=&CREATED_AGO.}.
        {endif/}
        <span role="separator" aria-label="&middot;"> &middot; </span>
        <a class="u-align-self-center" title="View workflow status in a diagram" href="&MAP_URL!ATTR."><span class="fa fa-workflow"></span></a>
      display-avatar: false
      display-badge: true

    badge: 
      label: State
      value: BADGE_TEXT
      state: BADGE_STATE
      display-label: false
      style: Default
      shape: Default
      size: Default
      column-width: Medium
      position: START
      alignment: START

    appearance: 
      apply-theme-colors: false
      style: Default
      hide-borders: false
      remove-padding: false

    row-selection: 
      type: None

    performance: 
      lazy-loading: false

    pagination: 
      type: Scroll
      show-total-count: false

    entity-title: 
      singular: workflow
      plural: workflows

    messages: 
      when-no-data-found: No Workflows
      no-data-found-icon: fa-workflow fa-lg

