      type: Send E-Mail

    settings: 
      from: '&APP_EMAIL.'
      to: '&DEMO_NOTIFICATION_EMAIL.'
      email-template: Job Change Notification # 1292051519560422884
      placeholder-values: |
        {
            "P_JOB_BEFORE":"&JOB.",
            "P_JOB_AFTER":"&P_NEW_JOB.",
            "P_ENAME":"&ENAME."
        }
      send-immediately: false

    error-handling: 
      log-message-type: None

    execution: 
      on-event: Complete
      outcome: Approved
      sequence: 20

    error: 
      stop-execution-on-error: true

    server-side-condition: 
      type: Expression
      language: PL/SQL
      pl/sql-expression: apex_app_setting.get_value('DEMO_NOTIFICATION_EMAIL') is not null

  participants: 
  - # ====== Participant: Potential Owner ========================
    id: 1279651858810277616
    identification: 
      type: Potential Owner

    value: 
      type: Static Value
      static-value: JANE

  - # ====== Participant: Potential Owner ========================
    id: 1279652295379277617
    identification: 
      type: Potential Owner

    value: 
      type: Static Value
      static-value: STEVE

  - # ====== Participant: Potential Owner ========================
    id: 1279652677672277617
