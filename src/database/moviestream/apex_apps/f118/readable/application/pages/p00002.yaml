- # ====== Region: Employees ===================================
  id: 13798317827283154
  identification: 
    name: Employees
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select EMPNO,
             ENAME,
             JOB,
             MGR,
             HIREDATE,
             SAL,
             COMM,
             DEPTNO,
              case 
               when deptno = 10 then 'style="background-color:yellow;"'
               when deptno = 20 then 'style="background-color:green;"'
               else 'white'
             end as ename_color
        from EMP

