- # ====== Region: Interactive Report Query Based on Current Use
  id: 1334392408374434741
  identification: 
    name: Interactive Report Query Based on Current User's Session
    type: PL/SQL Dynamic Content [Legacy]

  source: 
    pl/sql-code: |
      declare
        l_report apex_ir.t_report;
        l_region_id   number;
      begin
        select max(region_id) into l_region_id 
        from APEX_APPLICATION_PAGE_REGIONS 
        where application_id = :APP_ID and 
              page_id = :APP_PAGE_ID and 
              static_id = 'IR_EXAMPLE';
      
        l_report := apex_ir.get_report (
          p_page_id        => :app_page_id,
          p_region_id      => l_region_id);
        
        sys.htp.p('<p /><p />');
        sys.htp.p('<pre>');  
        sys.htp.p(apex_escape.html(l_report.sql_query));
        sys.htp.p('</pre>');
        sys.htp.p('<p /><p />');
        for i in 1..l_report.binds.count
        loop
            if i = 1 then
              sys.htp.p('<b>Binds Interactive Report Uses To Run</b><p />');
            end if;
            sys.htp.p(i||'. ');
            sys.htp.p(l_report.binds(i).name||' = '||apex_escape.html(l_report.binds(i).value));
            sys.htp.p('<br />');
        end loop;
        
      
      end;

  layout: 
    sequence: 30
    parent-region: Interactive Report Source # 2181575680905164481
    slot: SUB_REGIONS
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
