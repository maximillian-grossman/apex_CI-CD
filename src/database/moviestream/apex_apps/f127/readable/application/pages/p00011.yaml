- # ====== Region: About this page =============================
  id: 1334564312011067478
  identification: 
    name: About this page
    type: Static Content

  source: 
    html-code: |
      <p>This example shows how to call the <strong>APEX_IR</strong> runtime API to get the SQL statement that corresponds to the current user's interactive report filters and use this to dynamically update a chart.  Filter your report by status or any criteria, and the pie chart will update to match.  The SQL for the base interactive report and the user's current report filters and bind variables is exposed at the bottom of the page.  The "get chart data from IR result" dynamic action on this page provides an example of how to call the interactive report API's.</p>
      
      <p>As the interactive report is filtered or refreshed, a dynamic action is fired that creates a collection based on the current state of the interactive report.  It then refreshes the pie chart with the updated collection.  The result is having a pie chart that refreshes to match the filters of the report in real time.</p>

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Blank with Attributes
    template-options: 
    - '#DEFAULT#'
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

