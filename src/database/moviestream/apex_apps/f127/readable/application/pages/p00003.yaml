- # ====== Region: Classic Report ==============================
  id: 2694806606894771960
  identification: 
    name: Classic Report
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select rowid,
             ID,
             PROJECT,
             TASK_NAME,
             START_DATE,
             END_DATE,
             STATUS,
             ASSIGNED_TO,
             COST,
             BUDGET
      from EBA_DEMO_IR_PROJECTS
      where (nvl(:P3_STATUS,'0') = '0' or :P3_STATUS = status)
    page-items-to-submit: 
    - P3_STATUS

  order-by: 
    type: None

  layout: 
    sequence: 30
    parent-region: No Parent
