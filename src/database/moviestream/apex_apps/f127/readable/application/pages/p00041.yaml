- # ====== Region: Cards =======================================
  id: 637928203410488131
  identification: 
    name: Cards
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select ROWID,
             ID,
             ROW_VERSION_NUMBER,
             PROJECT,
             TASK_NAME,
             START_DATE,
             END_DATE,
             STATUS,
             ASSIGNED_TO,
             to_char( COST, 'FML999G999G999G999G990D00' ) COST,
             to_char( BUDGET, 'FML999G999G999G999G990D00' ) BUDGET
        from EBA_DEMO_IR_PROJECTS

  order-by: 
    type: None

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Cards Container
    template-options: 
    - '#DEFAULT#'
    - u-colors
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    static-id: cards_report
    region-display-selector: false
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    id: 637928690676488132
    appearance: 
      layout: Grid
      grid-columns: Auto

    title: 
      advanced-formatting: false
      column: PROJECT

    subtitle: 
      advanced-formatting: false
      column: TASK_NAME

    body: 
      advanced-formatting: true
      html-expression: 'Assigned: &ASSIGNED_TO.'

    secondary-body: 
      advanced-formatting: true
      html-expression: |
        Started: &START_DATE. Ended: &END_DATE.<br />
        Budget: &BUDGET. Cost:&COST.

    icon-and-badge: 
