- # ====== Region: About this page =============================
  id: 1355116704325113178
  identification: 
    name: About this page
    type: Static Content

  source: 
    html-code: "<p>This page demonstrates an interactive report that is based on SQL using a bind variable.  Adjust the project to control the value of the <strong>:P15_PROJECT</strong> bind variable.  Note that bind variables are typically prefixed with a colon.  The where clause of the query will show all rows if the value of the Oracle APEX page item <strong>P15_PROJECT</strong> is \"0\" (the Null Return Value of <strong>P15_PROJECT</strong>, which would be set for \"- All Projects -\", is set to \"0\").  See the full syntax below the full where clause of this query is <strong>NVL(:P15_PROJECT,'0') = '0' or project = :P15_PROJECT</strong>.  Bind variables make SQL more efficient and secure.</p>"

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

