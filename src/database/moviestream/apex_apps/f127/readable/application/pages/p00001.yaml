- # ====== Region: Projects ====================================
  id: 2586471725294771788
  identification: 
    name: Projects
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select	ROWID,
             ID,
             PROJECT,
             TASK_NAME,
             START_DATE,
             END_DATE,
             STATUS,
             ASSIGNED_TO,
             COST,
             BUDGET,
             budget - cost available_budget
      from EBA_DEMO_IR_PROJECTS

  layout: 
