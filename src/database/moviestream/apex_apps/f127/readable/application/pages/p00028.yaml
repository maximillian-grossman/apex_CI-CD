- # ====== Region: Query use regex functions ===================
  id: 1334851922595145843
  identification: 
    name: Query use regex functions
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select	
          PROJECT,
          TASK_NAME,
          START_DATE,
          END_DATE,
          STATUS,
          ASSIGNED_TO,
          COST,
          BUDGET,
          budget - cost as available_budget
      from
          EBA_DEMO_IR_PROJECTS
      where regexp_like(project||task_name,'(migrate|migration|migrated)','i')

  layout: 
    sequence: 10
    parent-region: Container # 2211215965166573206
