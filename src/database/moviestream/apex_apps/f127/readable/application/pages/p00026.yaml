- # ====== Region: About this page =============================
  id: 1334846417970094435
  identification: 
    name: About this page
    type: Static Content

  source: 
    html-code: <p>If a table contains hierarchical data, you can use CONNECT BY PRIOR to access the details about the current row's parents.  The Indented Hierarchy display in the classic report below is created using the pseudo column LEVEL.  That numerical representation is used to indent the employees using LPAD, producing a tree-like display.  Using SYS_CONNECT_BY_PATH, includes the full parent path (rather than just the immediate parent value).  The greater than sign is used as the separator and it is "LTRIM"ed so that it will not display before the president's name.</p>

  layout: 
    sequence: 10
    parent-region: No Parent
