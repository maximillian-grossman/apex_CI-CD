- # ====== Region: Inline Views ================================
  id: 1334778013764686130
  identification: 
    name: Inline Views
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      with total_sal as (
          select sum(sal) tsal
          from EBA_DEMO_IR_EMP
      )
      select dept_info.deptno,
          dept_info.dname,
          dept_info.loc,
          dept_info.employees,
          dept_info.dept_sal,
          dept_info.avg_sal,
          dept_info.median_sal,
          100*(dept_info.dept_sal/total_sal.tsal) pct_of_total
      from (  select deptno,
                  dname,
                  loc,
                  (   select count(*)
                      from EBA_DEMO_IR_EMP e
                      where e.deptno = d.deptno) employees,
                  (   select sum(sal)
                      from EBA_DEMO_IR_EMP e
                      where e.deptno = d.deptno) dept_sal,
                  (   select avg(sal)
                      from EBA_DEMO_IR_EMP e
                      where e.deptno = d.deptno) avg_sal,
                  (   select median(sal)
                      from EBA_DEMO_IR_EMP e
                      where e.deptno = d.deptno) median_sal
              from eba_demo_ir_dept d) dept_info,
          total_sal

