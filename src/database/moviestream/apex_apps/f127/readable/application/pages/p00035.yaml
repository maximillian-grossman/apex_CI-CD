- # ====== Region: Pipelined Functions =========================
  id: 1335010207752318868
  identification: 
    name: Pipelined Functions
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select t.page_id,
          p.page_name page,
          t.list_link_count,
          t.branch_count,
          t.button_count,
          t.breadcrumb_count,
          t.reportcol_count+t.irepcol_count reportcol_count,
          t.ireplink_count,
          t.tab_count,
          t.total 
      from table( eba_demo_ir_pkg.incomingPageRefsReport() ) t,
          apex_application_pages p
      where p.application_id = :APP_ID
          and p.page_id = t.page_id

