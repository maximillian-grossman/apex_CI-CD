- # ====== Region: About this page =============================
  id: 1335011897730318871
  identification: 
    name: About this page
    type: Static Content

  source: 
    html-code: |
      <p>The following use cases highlights PL/SQL Pipelined functions.
      Pipelined functions are functions which, instead of returning a single value, return data in a tabular format. This allows them to be referenced like a table in the from clause of a SQL statement using the table(...) syntax. Because they are PL/SQL, it is possible to use pipelined functions to collect or generate data which would be difficult or impossible to collect through standard SQL.</p>

  layout: 
    sequence: 10
    parent-region: No Parent
