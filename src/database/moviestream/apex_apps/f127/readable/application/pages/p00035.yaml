- # ====== Region: Package Source ==============================
  id: 1335009998147318868
  identification: 
    name: Package Source
    type: PL/SQL Dynamic Content [Legacy]

  source: 
    pl/sql-code: |
      sys.htp.p('<p><b>Specification:</b></p>');
      sys.htp.prn('<pre>');
      sys.htp.p('create or replace ');
      for c1 in (
          select text
          from user_source
          where upper(name) = 'EBA_DEMO_IR_PKG'
              and type = 'PACKAGE'
          order by line
          ) loop
          sys.htp.prn(apex_escape.html(c1.text));
      end loop;
      sys.htp.prn('</pre>');
      
      sys.htp.p('<p> </p>');
      sys.htp.p('<p><b>Body:</b></p>');
      sys.htp.prn('<pre>');
      sys.htp.p('create or replace ');
      for c1 in (
          select text
          from user_source
          where upper(name) = 'EBA_DEMO_IR_PKG'
              and type = 'PACKAGE BODY'
          order by line
          ) loop
          sys.htp.prn(apex_escape.html(c1.text));
      end loop;
      sys.htp.prn('</pre>');

