- # ====== Region: About this page =============================
  id: 1335000220714288866
  identification: 
    name: About this page
    type: Static Content

  source: 
    html-code: <p>The following query highlights RANK and DENSE_RANK functions to provide rank to the records based on some column value or expression. In case of a tie of 2 records at position N, RANK declares 2 positions N and skips position N+1 and gives position N+2 to the next record. While DENSE_RANK declares 2 positions N but does not skip position N+1.  Expand the <strong>SQL Source</strong> to see an example.</p>

  layout: 
