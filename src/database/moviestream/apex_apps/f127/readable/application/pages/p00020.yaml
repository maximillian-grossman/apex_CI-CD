- # ====== Region: Query =======================================
  id: 1334775118116678366
  identification: 
    name: Query
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select * 
      from (
      select	
             PROJECT,
             TASK_NAME,
             START_DATE,
             END_DATE,
             STATUS,
             ASSIGNED_TO,
             COST,
             BUDGET
      from EBA_DEMO_IR_PROJECTS
      order by budget desc, project, task_name
      ) x
      where rownum <= 10

  layout: 
    sequence: 10
    parent-region: Container # 2222000707161247464
