- # ====== Page Item: P5_STATUS ================================
  id: 2699063006386884207
  identification: 
    name: P5_STATUS
    type: Checkbox Group

  label: 
    label: Status
    alignment: Left

  settings: 
    number-of-columns: 1

  multiple-values: 
    type: Delimited List
    separator: ':'

  layout: 
    sequence: 30
    region: Filter # 2698838117381867303
    slot: BODY
    alignment: Left
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic
    label-column-span: Page Template Default

  appearance: 
    template: Optional - Above
    template-options: 
    - '#DEFAULT#'

  validation: 
    value-required: false

  list-of-values: 
    type: Shared Component
    list-of-values: DISTINCT STATUS VALUES # 2698632922223831997
    display-extra-values: true

  advanced: 
    warn-on-unsaved-changes: Page Default

  source: 
    type: Function Body
    language: PL/SQL
    pl/sql-function-body: |
      declare r varchar2(500) := null;
      begin
      for c1 in (select distinct status from EBA_DEMO_IR_PROJECTS) loop
         r := r||c1.status||':';
      end loop;
      return rtrim(r,':');
      end;
    used: Only when current value in session state is null

  session-state: 
    storage: Per Session (Persistent)

  security: 
    session-state-protection: Unrestricted
    store-value-encrypted-in-session-state: true
