- # ====== Region: Filtered Data ===============================
  id: 2698974916991877860
  identification: 
    name: Filtered Data
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select rowid,
             ID,
             PROJECT,
             TASK_NAME,
             START_DATE,
             END_DATE,
             STATUS,
             ASSIGNED_TO,
             COST,
             BUDGET
      from EBA_DEMO_IR_PROJECTS
      where (nvl(:P5_STATUS,'0') = '0' or instr(:P5_STATUS||':',status||':') > 0) and
           --
           (:P5_SEARCH is null or 
           instr(upper(project) || '//'||
           upper(TASK_NAME) || '//'||
           upper(ASSIGNED_TO) || '//'||
           upper(STATUS),upper(:P5_SEARCH) ) > 0) and
           --
           (:P5_ASSIGNEE is null or instr(upper(assigned_to),upper(:P5_ASSIGNEE))>0)

  order-by: 
    type: None

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Standard
    template-options: 
    - '#DEFAULT#'
    - t-Region--noPadding
    - t-Region--scrollBody
    - t-Region--noBorder
    - t-Region--hideHeader js-addHiddenHeadingRoleDesc
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    static-id: filter_side_bar
    region-display-selector: false
    exclude-title-from-translation: true

  server-cache: 
