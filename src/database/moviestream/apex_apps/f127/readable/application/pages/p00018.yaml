- # ====== Region: About this page =============================
  id: 1354942415291761000
  identification: 
    name: About this page
    type: Static Content

  source: 
    html-code: <p>This page demonstrates how to create URLs that link to interactive report pages.  Click on the example links below and note the URL syntax used.  Use <strong>RR</strong> to reset an interactive report, use <strong>CR</strong> to clear an interactive report settings.  Use <strong>IR_&lt;your_report_column&gt;</strong> syntax to filter a report for an exact match.  Use <strong>IRC_&lt;your_report_column&gt;</strong> for a contains match, use <strong>IRGT_</strong> and <strong>IRLT_</strong> for greater than and less than filters. Pagination can be reset using <strong>RP</strong>.</p>

  layout: 
