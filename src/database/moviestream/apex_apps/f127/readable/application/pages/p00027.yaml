- # ====== Region: Coalesce Query ==============================
  id: 1335069823596775519
  identification: 
    name: Coalesce Query
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select
          empno,
          ename,
          job,
          mgr,
          hiredate,
          sal,
          comm,
          deptno
      from
          eba_demo_ir_emp
      where
          coalesce(comm, sal) > sal
      order by
