- # ====== Region: Replace Query ===============================
  id: 1335085728893909491
  identification: 
    name: Replace Query
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select
          empno,
          ename,
          replace(job,'SALESMAN','SALESPERSON') as job,
          mgr,
          hiredate,
          sal,
          comm,
          deptno
      from
          eba_demo_ir_emp
      where
