- # ====== Region: Substr Query ================================
  id: 1334991497427228600
  identification: 
    name: Substr Query
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select
          empno,
          ename,
          job,
          mgr,
          hiredate,
          sal,
          comm,
          deptno
      from
          eba_demo_ir_emp
      where
          substr(ename,1,1) = 'M'
      order by
          2

  order-by: 
    type: None

