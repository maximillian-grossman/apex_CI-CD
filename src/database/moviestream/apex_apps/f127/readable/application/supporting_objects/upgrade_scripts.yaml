- # ====== Upgrade Script: Drop old objects ====================
  id: 192079975846461576
  identification: 
    name: Drop old objects

  execution: 
    sequence: 59

  server-side-condition: 
    type: Rows returned
    sql-query: |
      select object_name
      from user_objects
      where object_type = 'PACKAGE'
          and object_name in ( 'EBA_DEMO_IR_FILTER_FW', 'EBA_DEMO_IR_FILTER2_FW' )
      union all
      select object_name
      from user_objects
      where object_type = 'TYPE'
          and object_name in ( 'EBA_DEMO_IR_ACTIVE_FILTERS_TBL', 'EBA_DEMO_IR_FILTER_COL_TBL',
                              'EBA_DEMO_IR_FILTER_COLUMN_T', 'EBA_DEMO_IR_ACTIVE_FILTERS_T' )

